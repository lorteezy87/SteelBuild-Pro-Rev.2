    - generic [ref=e86]:
      - generic [ref=e87]: The cost of gaps
      - heading "Steel projects don't fail all at once." [level=2] [ref=e88]
      - paragraph [ref=e89]: They fail in a thousand small gaps — documents that can't be found, inspections that weren't recorded, evidence that doesn't exist when you need it.
    - generic [ref=e90]:
      - generic [ref=e91]:
        - generic [ref=e92]: GAP 01
        - heading "Mill certs buried in an inbox" [level=3] [ref=e93]
        - paragraph [ref=e94]: Your CWI needs the MTR for W14×90 heat 84726 — but it's a forwarded email from three weeks ago, and nobody knows which attachment is current.
      - generic [ref=e95]:
        - generic [ref=e96]: GAP 02
        - heading "Field photos with no context" [level=3] [ref=e97]
        - paragraph [ref=e98]: 200 bolt-up photos on a foreman's phone. No piece marks, no grid lines, no connection IDs. Useless for the turnover package.
      - generic [ref=e99]:
