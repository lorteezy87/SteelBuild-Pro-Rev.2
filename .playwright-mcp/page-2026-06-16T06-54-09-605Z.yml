        - heading "RFIs in spreadsheet purgatory" [level=3] [ref=e101]
        - paragraph [ref=e102]: The log is 14 tabs deep. The GC says they answered RFI-047 Tuesday. Your PM never got it. The EOR is waiting on both.
      - generic [ref=e103]:
        - generic [ref=e104]: GAP 04
        - heading "Drawings marked up on paper" [level=3] [ref=e105]
        - paragraph [ref=e106]: The detailer sent Rev. C, but the shop floor is fabricating Rev. B. The approval stamp lives in a folder called "FINAL_FINAL_v2."
      - generic [ref=e107]:
        - generic [ref=e108]: GAP 05
        - heading "NCRs on sticky notes" [level=3] [ref=e109]
        - paragraph [ref=e110]: A flange was welded on the wrong side. The welder knows. The foreman knows. The NCR won't exist until someone writes it up — if ever.
      - generic [ref=e111]:
        - generic [ref=e112]: GAP 06
        - heading "Change orders you can't prove" [level=3] [ref=e113]
        - paragraph [ref=e114]: The GC added 47 embed plates outside the original scope. The email's somewhere. Good luck finding it when they dispute the CO.
