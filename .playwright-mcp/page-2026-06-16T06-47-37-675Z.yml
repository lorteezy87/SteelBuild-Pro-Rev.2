      - generic [ref=e79]: The cost of gaps
      - heading "Steel projects don't fail all at once." [level=2] [ref=e80]
      - paragraph [ref=e81]: They fail in a thousand small gaps — documents that can't be found, inspections that weren't recorded, evidence that doesn't exist when you need it.
    - generic [ref=e82]:
      - generic [ref=e83]:
        - heading "Mill certs buried in an inbox" [level=3] [ref=e84]
        - paragraph [ref=e85]: Your CWI needs the MTR for W14×90 heat 84726 — but it's a forwarded email from three weeks ago, and nobody knows which attachment is current.
      - generic [ref=e86]:
        - heading "Field photos with no context" [level=3] [ref=e87]
        - paragraph [ref=e88]: 200 bolt-up photos on a foreman's phone. No piece marks, no grid lines, no connection IDs. Useless for the turnover package.
      - generic [ref=e89]:
        - heading "RFIs in spreadsheet purgatory" [level=3] [ref=e90]
        - paragraph [ref=e91]: The log is 14 tabs deep. The GC says they answered RFI-047 Tuesday. Your PM never got it. The EOR is waiting on both.
      - generic [ref=e92]:
        - heading "Drawings marked up on paper" [level=3] [ref=e93]
        - paragraph [ref=e94]: The detailer sent Rev. C, but the shop floor is fabricating Rev. B. The approval stamp lives in a folder called "FINAL_FINAL_v2."
      - generic [ref=e95]:
        - heading "NCRs on sticky notes" [level=3] [ref=e96]
        - paragraph [ref=e97]: A flange was welded on the wrong side. The welder knows. The foreman knows. The NCR won't exist until someone writes it up — if ever.
      - generic [ref=e98]:
        - heading "Change orders you can't prove" [level=3] [ref=e99]
        - paragraph [ref=e100]: The GC added 47 embed plates outside the original scope. The email's somewhere. Good luck finding it when they dispute the CO.
