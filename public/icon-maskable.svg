<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SteelBuild-Pro">
  <title>SteelBuild-Pro</title>
  <!-- Full-bleed dark field: maskable icons must paint to every edge so the
       platform's adaptive-icon mask (circle / squircle / rounded-rect) never
       reveals a transparent corner. -->
  <rect width="512" height="512" fill="#0D1117"/>
  <!-- Mark scaled to 60% about the centre so the hexagon's points sit inside
       the maskable safe zone (central 80% circle) and are never clipped. -->
  <g transform="translate(256 256) scale(0.6) translate(-256 -256)">
    <path fill-rule="evenodd" fill="#F5BB00"
          d="M256 46 L410 142 L410 370 L256 466 L102 370 L102 142 Z
             M158 176 L410 222 L410 250 L200 208 Z
             M354 336 L102 290 L102 262 L312 304 Z"/>
  </g>
</svg>
