<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Brand identity -->
    <title>SteelBuild Pro — Structural Steel Project Management</title>
    <meta name="description" content="SteelBuild Pro is a real-time construction project management platform for structural steel — tracking fabrication, deliveries, RFIs, costs, and field operations from detailing through closeout." />
    <meta name="theme-color" content="#0B0E11" />

    <!-- Installable app / iOS home-screen (PWA). The native App Store build uses
         Capacitor and ignores these; they only affect "Add to Home Screen". -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SteelBuild" />

    <!-- Social / link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://steelbuild-pro.com" />
    <meta property="og:title" content="SteelBuild Pro — Structural Steel Project Management" />
    <meta property="og:description" content="The project delivery platform built for structural steel fabricators and erectors — from detailing approval to turnover package." />
    <meta property="og:image" content="https://steelbuild-pro.com/steelbuild-pro-logo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SteelBuild Pro — Structural Steel Project Management" />
    <meta name="twitter:image" content="https://steelbuild-pro.com/steelbuild-pro-logo.jpg" />

    <!-- Favicon & app icons. A single full-bleed square SVG diamond mark —
         scales sharply at any size and iOS rounds the apple-touch-icon from
         the square field. (Replaced the prior PNG set; see public/favicon.svg.) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home-screen icon: a 180×180 PNG (iOS does not reliably render SVG
         apple-touch-icons). -->
    <link rel="apple-touch-icon" href="/steelbuild-pro-icon-180.png" />

    <!-- Apply persisted theme before first paint to avoid FOUC -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("sbp-theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          if (theme === "dark") root.classList.add("steelbuild-dark");
          else root.classList.remove("steelbuild-dark");
          var accent = localStorage.getItem("sbp-accent");
          if (accent) root.setAttribute("data-accent", accent);
          var contrast = localStorage.getItem("sbp-contrast");
          if (contrast) root.setAttribute("data-contrast", contrast);
        } catch (e) { /* private browsing */ }
      })();
    </script>

    <!-- Preconnect for web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Loading state: visible until React hydrates -->
    <style>
      body { margin: 0; background: #0B0E11; }
      #root:empty {
        display: flex;
        flex-direction: column;
        gap: 30px;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0B0E11;
      }
      #root:empty::before {
        content: '';
        width: min(440px, 82vw);
        aspect-ratio: 16 / 9;
        background: url('/steelbuild-pro-logo.jpg') center / contain no-repeat;
      }
      #root:empty::after {
        content: '';
        width: 28px;
        height: 28px;
        border: 2px solid #30363D;
        border-top-color: #C89B20;
        border-radius: 50%;
        animation: _sbp-spin 0.7s linear infinite;
      }
      @keyframes _sbp-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
