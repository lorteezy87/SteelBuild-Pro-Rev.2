<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Brand identity -->
    <title>SteelBuild Pro — Structural Steel Project Management</title>
    <meta name="description" content="SteelBuild Pro is a real-time construction project management platform for structural steel — tracking fabrication, deliveries, RFIs, costs, and field operations from detailing through closeout." />
    <meta name="theme-color" content="#0B0E11" />

    <!-- Social / link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://steelbuild-pro.com" />
    <meta property="og:title" content="SteelBuild Pro — Structural Steel Project Management" />
    <meta property="og:description" content="The project delivery platform built for structural steel fabricators and erectors — from detailing approval to turnover package." />
    <meta property="og:image" content="https://steelbuild-pro.com/steelbuild-pro-logo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SteelBuild Pro — Structural Steel Project Management" />
    <meta name="twitter:image" content="https://steelbuild-pro.com/steelbuild-pro-logo.jpg" />

    <!-- Favicon & app icons. apple-touch-icon must be SQUARE (iOS crops a
         non-square one) — the logo wordmark is 3:2, so these are the diamond
         centered on a square dark field. -->
    <link rel="icon" type="image/png" href="/steelbuild-pro-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/steelbuild-pro-icon-180.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/steelbuild-pro-icon-512.png" />

    <!-- Preconnect for web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Loading state: visible until React hydrates -->
    <style>
      body { margin: 0; background: #0B0E11; }
      #root:empty {
        display: flex;
        flex-direction: column;
        gap: 30px;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0B0E11;
      }
      #root:empty::before {
        content: '';
        width: min(360px, 72vw);
        aspect-ratio: 3 / 2;
        background: url('/steelbuild-pro-logo.jpg') center / contain no-repeat;
      }
      #root:empty::after {
        content: '';
        width: 28px;
        height: 28px;
        border: 2px solid #30363D;
        border-top-color: #C89B20;
        border-radius: 50%;
        animation: _sbp-spin 0.7s linear infinite;
      }
      @keyframes _sbp-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
