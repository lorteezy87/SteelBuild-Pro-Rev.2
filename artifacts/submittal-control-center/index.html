<title>Submittal Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ===== tokens — light is the base; dark redefines values only ===== */
:root{
  color-scheme: light;
  --ground:#F2F0EC; --surface:#FBFAF8; --raised:#FFFFFF; --sunken:#E8E5DE; --well:#EEEBE4;
  --ink:#17150F; --ink-2:#403C34; --muted:#6C685E; --faint:#938E82;
  --line:#DFDBD2; --line-2:#CAC5B8; --track:#E3DFD6;

  --accent:#C89B20; --accent-2:#9C7710; --accent-tint:#F7EDD0; --on-accent:#17150F;

  --lane-house:#1F6BAE; --lane-review:#C4650C; --lane-released:#008068;
  --st-good:#008068; --st-warn:#C4650C; --st-serious:#A8461A; --st-crit:#9E2B20;

  --t-blue-bg:#E5EEF7;  --t-blue-ink:#15527F;
  --t-amber-bg:#F9EBDB; --t-amber-ink:#8D4907;
  --t-teal-bg:#DDEFEA;  --t-teal-ink:#00604E;
  --t-red-bg:#F8E4E1;   --t-red-ink:#8A2318;
  --t-grey-bg:#E8E5DE;  --t-grey-ink:#5B574D;

  --focus:#1F6BAE;
  --sh-1:0 1px 2px rgba(23,21,15,.06);
  --sh-2:0 1px 3px rgba(23,21,15,.08), 0 14px 34px -18px rgba(23,21,15,.32);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:Inter,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0F0F0E; --surface:#181816; --raised:#1F1F1C; --sunken:#141413; --well:#131312;
    --ink:#EFEDE7; --ink-2:#CAC6BC; --muted:#98948A; --faint:#78746B;
    --line:#302F2A; --line-2:#413F38; --track:#28271F;
    --accent:#E0B030; --accent-2:#E7BE4C; --accent-tint:#352C12; --on-accent:#141310;
    --lane-house:#3A88C9; --lane-review:#D9761A; --lane-released:#0C8E77;
    --st-good:#0C8E77; --st-warn:#D9761A; --st-serious:#C9611F; --st-crit:#DF5B4D;
    --t-blue-bg:#14293B;  --t-blue-ink:#8FC0EA;
    --t-amber-bg:#38250F; --t-amber-ink:#F0A961;
    --t-teal-bg:#0D2A26;  --t-teal-ink:#5CC3AC;
    --t-red-bg:#381916;   --t-red-ink:#F09287;
    --t-grey-bg:#24231E;  --t-grey-ink:#A6A296;
    --focus:#6FAEE4;
    --sh-1:0 1px 2px rgba(0,0,0,.45);
    --sh-2:0 1px 3px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0F0F0E; --surface:#181816; --raised:#1F1F1C; --sunken:#141413; --well:#131312;
  --ink:#EFEDE7; --ink-2:#CAC6BC; --muted:#98948A; --faint:#78746B;
  --line:#302F2A; --line-2:#413F38; --track:#28271F;
  --accent:#E0B030; --accent-2:#E7BE4C; --accent-tint:#352C12; --on-accent:#141310;
  --lane-house:#3A88C9; --lane-review:#D9761A; --lane-released:#0C8E77;
  --st-good:#0C8E77; --st-warn:#D9761A; --st-serious:#C9611F; --st-crit:#DF5B4D;
  --t-blue-bg:#14293B;  --t-blue-ink:#8FC0EA;
  --t-amber-bg:#38250F; --t-amber-ink:#F0A961;
  --t-teal-bg:#0D2A26;  --t-teal-ink:#5CC3AC;
  --t-red-bg:#381916;   --t-red-ink:#F09287;
  --t-grey-bg:#24231E;  --t-grey-ink:#A6A296;
  --focus:#6FAEE4;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 1px 3px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--f-body);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  min-height:100dvh; display:flex; flex-direction:column}
::selection{background:var(--accent-tint); color:var(--ink)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
h1,h2,h3{margin:0; font-family:var(--f-display); font-weight:600; letter-spacing:.01em; text-wrap:balance}

.eyebrow{font:600 10px/1 var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:12.5px}

/* ===== controls ===== */
.btn{display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
  font:600 12.5px/1 var(--f-body); color:var(--ink-2); background:var(--surface);
  border:1px solid var(--line-2); border-radius:5px; padding:7px 11px;
  transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--raised); border-color:var(--faint); color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07); color:var(--on-accent)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted); font-weight:500}
.btn.ghost:hover{background:var(--sunken); color:var(--ink)}
.btn.danger{color:var(--st-crit)}
.btn.danger:hover{background:var(--t-red-bg); border-color:var(--st-crit)}
.btn.sm{padding:5px 9px; font-size:11.5px}
.btn[disabled]{opacity:.45; pointer-events:none}

input[type=text],input[type=search],input[type=url],input[type=number],input[type=date],select,textarea{
  font:400 13px/1.3 var(--f-body); color:var(--ink); background:var(--raised);
  border:1px solid var(--line-2); border-radius:5px; padding:7px 9px; width:100%; min-width:0}
input[type=date],input[type=number]{font-family:var(--f-mono); font-size:12.5px; font-variant-numeric:tabular-nums}
textarea{resize:vertical; min-height:74px; line-height:1.55}
select{cursor:pointer; appearance:none; padding-right:24px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%, calc(100% - 9px) 52%; background-size:4px 4px,4px 4px; background-repeat:no-repeat}
label.fld{display:flex; flex-direction:column; gap:5px}
label.fld > span:first-child{font:600 10px/1 var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}

.pill{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font:600 11px/1 var(--f-body); padding:4px 8px; border-radius:4px;
  background:var(--t-grey-bg); color:var(--t-grey-ink)}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.pill.blue{background:var(--t-blue-bg); color:var(--t-blue-ink)}
.pill.amber{background:var(--t-amber-bg); color:var(--t-amber-ink)}
.pill.teal{background:var(--t-teal-bg); color:var(--t-teal-ink)}
.pill.red{background:var(--t-red-bg); color:var(--t-red-ink)}
.pill.gold{background:var(--accent-tint); color:var(--accent-2)}

.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
  border:1px solid var(--line-2); background:var(--surface); border-radius:20px;
  padding:5px 11px; font:600 11.5px/1 var(--f-body); color:var(--muted); transition:all .12s}
.chip:hover{border-color:var(--faint); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-tint); border-color:var(--accent); color:var(--accent-2)}
.chip b{font-family:var(--f-mono); font-size:11px; font-weight:600}
.chip .sw{width:7px; height:7px; border-radius:50%; flex:none}

/* ===== masthead ===== */
.masthead{position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); box-shadow:var(--sh-1)}
.mast-row{width:100%; padding:0 22px; min-height:56px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.mark{display:flex; align-items:center; gap:9px; margin-right:4px}
.mark .beam{width:18px; height:18px; flex:none; background:var(--accent);
  clip-path:polygon(0 0,100% 0,100% 26%,63% 26%,63% 74%,100% 74%,100% 100%,0 100%,0 74%,37% 74%,37% 26%,0 26%)}
.mark .name{font-family:var(--f-display); font-weight:700; font-size:18px; letter-spacing:.04em;
  text-transform:uppercase; white-space:nowrap; line-height:1}
.mark .sub{font:600 9.5px/1 var(--f-body); letter-spacing:.15em; text-transform:uppercase; color:var(--muted)}
.tabs{display:flex; gap:2px}
.tab{cursor:pointer; border:0; background:transparent; color:var(--muted);
  font:600 12.5px/1 var(--f-body); padding:8px 11px; border-radius:5px}
.tab:hover{background:var(--sunken); color:var(--ink)}
.tab[aria-current="true"]{background:var(--accent-tint); color:var(--accent-2)}
.mast-spacer{flex:1}
.mast-tools{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:9px 0}
.mast-tools select{width:auto; min-width:158px; max-width:250px; padding:6px 24px 6px 9px; font-size:12.5px}
.whochip{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--raised); border-radius:20px;
  padding:3px 11px 3px 4px; font:600 12px/1 var(--f-body); color:var(--ink-2)}
.whochip.plain{padding:6px 11px}
.whochip.bare{padding:3px; border-color:transparent; background:transparent}
.whochip.bare:hover{border-color:var(--line-2)}
.whochip .ini{width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center; font:700 9.5px/1 var(--f-body)}
.conn{display:inline-flex; align-items:center; gap:6px; font:500 11.5px/1 var(--f-body); color:var(--muted)}
.conn .led{width:7px; height:7px; border-radius:50%; background:var(--st-good); flex:none}
.conn.off .led{background:var(--faint)}
.conn.bad .led{background:var(--st-crit)}
@media (max-width:1200px){ .mark .sub{display:none} }
@media (max-width:880px){
  .mast-row{padding:0 14px}
  .mast-spacer{display:none}
  .mast-tools{width:100%; padding:0 0 10px}
  .mast-tools select{flex:1}
}

/* ===== shell ===== */
.wrap{width:100%; padding:16px 22px 20px; flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column}
@media (max-width:880px){ .wrap{padding:12px 14px 16px} }
.wrap > .section:last-child{margin-bottom:0}
.section{margin-bottom:20px}
.section-head{display:flex; align-items:baseline; gap:12px; margin-bottom:10px; flex-wrap:wrap}
.section-head h2{font-size:16px; text-transform:uppercase; letter-spacing:.06em}
.section-head .hint{font-size:12px; color:var(--muted)}
.banner{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--st-warn);
  background:var(--t-amber-bg); color:var(--t-amber-ink); border-radius:6px;
  padding:10px 13px; font-size:12.5px; margin-bottom:14px}
.banner.info{border-color:var(--line-2); background:var(--sunken); color:var(--ink-2)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.panel-head{padding:12px 14px 11px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.panel-head h3{font-size:13.5px; text-transform:uppercase; letter-spacing:.07em}
.panel-head .hint{font-size:11.5px; color:var(--muted); margin-left:auto}
.panel-body{padding:14px}
.grid-2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:14px; align-items:start}
.grid-3{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; align-items:start}
@media (max-width:1080px){ .grid-2{grid-template-columns:minmax(0,1fr)} }

/* ===== KPI ===== */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.kpi{background:var(--surface); padding:11px 13px 11px; display:flex; flex-direction:column; gap:2px; min-width:0;
  border-top:2px solid transparent}
.kpi .l{font:600 10px/1.3 var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.kpi .v{font-family:var(--f-display); font-weight:700; font-size:27px; line-height:1.08; font-variant-numeric:tabular-nums}
.kpi .u{font-family:var(--f-body); font-weight:600; font-size:12px; color:var(--muted); margin-left:3px}
.kpi .s{font-size:11.5px; color:var(--faint); line-height:1.35}
.kpi.alert{border-top-color:var(--st-crit)} .kpi.alert .v{color:var(--st-crit)}
.kpi.warn{border-top-color:var(--st-warn)}  .kpi.warn .v{color:var(--st-warn)}
.kpi.good{border-top-color:var(--st-good)}  .kpi.good .v{color:var(--st-good)}

/* ===== aging chart ===== */
.chart{display:flex; align-items:flex-end; gap:14px; height:118px}
.chart .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; min-width:0}
.chart .cnt{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:12.5px;
  text-align:center; margin-bottom:5px; color:var(--ink-2)}
.chart .bar{width:100%; border-radius:4px 4px 0 0; cursor:pointer; border:0; padding:0; flex:none; transition:filter .12s}
.chart .bar:hover{filter:brightness(1.14)}
.chart .bar.empty{background:var(--track) !important; cursor:default}
.chart-x{display:flex; gap:14px; border-top:1px solid var(--line-2); padding-top:7px}
.chart-x .lx{flex:1; text-align:center; font:500 11px/1.25 var(--f-body); color:var(--muted); min-width:0}

/* ===== mini tables (scorecard / forecast) ===== */
table.mini{width:100%; border-collapse:collapse; font-size:12.5px}
table.mini th{text-align:left; font:600 9.5px/1 var(--f-body); letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); padding:0 10px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
table.mini td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.mini tr:last-child td{border-bottom:0}
table.mini td.n{font-family:var(--f-mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
table.mini th.n{text-align:right}
.meter{display:block; height:6px; border-radius:3px; background:var(--track); overflow:hidden; min-width:56px}
.meter i{display:block; height:100%; border-radius:3px; min-width:2px}

/* ===== project cards ===== */
.pcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 14px; display:flex; flex-direction:column; gap:10px; text-align:left;
  cursor:pointer; font:inherit; color:inherit; transition:border-color .12s, box-shadow .12s}
.pcard:hover{border-color:var(--line-2); box-shadow:var(--sh-1)}
.pcard .top{display:flex; align-items:flex-start; gap:10px}
.pcard h3{font-size:15.5px; line-height:1.18; flex:1; min-width:0}
.pcard .meta{font-size:11.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:3px 10px; margin-bottom:auto}
.stack{display:flex; height:9px; gap:2px; border-radius:3px; overflow:hidden; background:var(--track)}
.stack i{display:block; height:100%; border-radius:2px}
.stack-key{display:flex; flex-wrap:wrap; gap:3px 12px; font-size:11px; color:var(--muted)}
.stack-key .k{display:inline-flex; align-items:center; gap:5px}
.stack-key .sw{width:8px; height:8px; border-radius:2px; flex:none}
.stack-key b{font-family:var(--f-mono); font-weight:500; color:var(--ink-2)}

/* ===== action list ===== */
.acts{display:flex; flex-direction:column}
.act{display:grid; grid-template-columns:3px minmax(0,1fr) auto; gap:11px; align-items:center;
  padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer;
  background:transparent; border-left:0; border-right:0; border-top:0; text-align:left; font:inherit; color:inherit; width:100%}
.act:last-child{border-bottom:0}
.act:hover{background:var(--sunken)}
.act .why{align-self:stretch; border-radius:2px; min-height:26px}
.act .t{min-width:0}
.act .t b{display:block; font:600 13px/1.35 var(--f-body); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.act .t span{display:block; font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.empty-note{padding:24px 14px; text-align:center; color:var(--muted); font-size:12.5px}

/* ===== filters ===== */
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px}
.filters select,.filters input[type=text],.filters input[type=search]{width:auto; min-width:136px; padding:6px 9px; font-size:12.5px}
.filters select{padding-right:24px}
.filters .grow{flex:1; min-width:190px; width:100%}
.filters .eyebrow{white-space:nowrap}
.chipclear{font:500 11.5px/1 var(--f-body); color:var(--muted); background:transparent; border:0;
  cursor:pointer; text-decoration:underline; padding:6px 2px}
.chipclear:hover{color:var(--ink)}

/* ===== the log grid ===== */
.grid-shell{border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  overflow:hidden; display:flex; flex-direction:column; flex:1 1 auto; min-height:280px}
.table-wrap{overflow:auto; flex:1 1 auto; min-height:0}
table.log{border-collapse:separate; border-spacing:0; width:100%; min-width:1720px}
table.log th{position:sticky; top:0; z-index:5; background:var(--well);
  font:600 9.5px/1.2 var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  text-align:left; padding:0; border-bottom:1px solid var(--line-2); white-space:nowrap}
table.log th .sortbtn{display:flex; align-items:center; gap:5px; width:100%; padding:10px;
  background:none; border:0; cursor:pointer; font:inherit; color:inherit; letter-spacing:inherit; text-transform:inherit}
table.log th .sortbtn:hover{color:var(--ink)}
table.log th .arw{font-size:8px; opacity:0; transition:opacity .12s}
table.log th[aria-sort] .sortbtn{color:var(--accent-2)}
table.log th[aria-sort] .arw{opacity:1}
table.log th.plain{padding:10px}
table.log td{padding:5px 10px; border-bottom:1px solid var(--line); vertical-align:middle;
  font-size:13px; height:42px; white-space:nowrap; background:var(--surface)}
table.log td.c-title{white-space:normal}
table.log tbody tr:last-child td{border-bottom:0}
table.log tbody tr:hover td{background:var(--sunken)}
table.log tr.grp td{background:var(--well); font:700 10px/1 var(--f-body); letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2); padding:9px 10px; height:auto;
  border-top:1px solid var(--line-2); border-bottom:1px solid var(--line-2)}
table.log tr[data-sev="crit"] td:first-child{box-shadow:inset 3px 0 0 var(--st-crit)}
table.log tr[data-sev="warn"] td:first-child{box-shadow:inset 3px 0 0 var(--st-warn)}
table.log tr[data-sev="good"] td:first-child{box-shadow:inset 3px 0 0 var(--st-good)}
table.log th:first-child, table.log td.c-num{
  position:sticky; left:0; z-index:4; border-right:1px solid var(--line)}
table.log thead th:first-child{z-index:6; border-right:1px solid var(--line-2)}
table.log td.c-proj{min-width:178px} table.log td.c-status{min-width:146px}
table.log td.c-code{min-width:88px} table.log td.c-bic{min-width:118px} table.log td.c-spec{min-width:96px}
table.log .rowlink{background:none; border:0; padding:0; font:inherit; color:var(--ink); cursor:pointer;
  text-align:left; display:block; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
table.log .rowlink:hover{color:var(--accent-2); text-decoration:underline}
table.log select,table.log input[type=date]{background:transparent; border:1px solid transparent;
  border-radius:4px; padding:4px 6px; font-size:12px; width:100%}
table.log select{padding-right:20px}
table.log input[type=date]{min-width:124px}
table.log select:hover,table.log input[type=date]:hover{border-color:var(--line-2); background:var(--raised)}
table.log select:focus,table.log input[type=date]:focus{border-color:var(--focus); background:var(--raised)}
table.log input[type=date].blank:not(:focus)::-webkit-datetime-edit{opacity:0}
table.log input[type=date].ofs-late{color:var(--st-crit); font-weight:600}
table.log input[type=date].ofs-soon{color:var(--st-warn); font-weight:600}

<main class="wrap" id="view" data-live-guard>
  <div class="skel"><div class="b">Loading the shared tracker…</div><p>Live data for every project loads from this artifact's shared store.</p></div>
</main>

<div id="overlay"></div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================ constants ============================ */
const THEME_KEY = "sbp-theme";
const WHO_KEY   = "sbp-submittal-who";
const FILE_CAP  = 160 * 1024;   /* 160 KB raw — a db document holds 256 KiB serialized */
const FILE_OK   = ".pdf,.png,.jpg,.jpeg,.webp,.gif,.csv,.txt,.md,.json,.xlsx,.docx,.svg";

const STATUSES = [
  { k:"not_started", label:"Not started",      lane:"house",    tone:"" },
  { k:"detailing",   label:"In detailing",     lane:"house",    tone:"blue" },
  { k:"internal",    label:"Internal review",  lane:"house",    tone:"blue" },
  { k:"submitted",   label:"Submitted",        lane:"review",   tone:"amber" },
  { k:"in_review",   label:"In review",        lane:"review",   tone:"amber" },
  { k:"returned",    label:"Returned",         lane:"house",    tone:"blue" },
  { k:"released",    label:"Released for fab", lane:"released", tone:"teal" },
  { k:"void",        label:"Void",             lane:null,       tone:"" }
];
const CODES = [
  { k:"",    label:"—",                      short:"—",   tone:"" },
  { k:"NET", label:"No Exceptions Taken",    short:"NET", tone:"teal" },
  { k:"MCN", label:"Make Corrections Noted", short:"MCN", tone:"teal" },
  { k:"RR",  label:"Revise & Resubmit",      short:"R&R", tone:"amber" },
  { k:"REJ", label:"Rejected",               short:"REJ", tone:"red" },
  { k:"FRO", label:"For Reference Only",     short:"FRO", tone:"" }
];
const BICS  = ["", "Detailer", "S&H Steel", "GC", "Architect", "EOR", "Owner", "Vendor"];
const TYPES = ["Shop drawings","Erection drawings","Anchor bolt plan","Connection calcs",
  "Mill certs","Bolt certs","Weld procedures (WPS/PQR)","Welder certs","Paint / coatings",
  "Galvanizing","Metal deck","Joists","Misc metals","Stairs & rails","Embeds","Field bolt list"];
const LINK_LABELS = ["Submitted set","Returned / stamped set","Transmittal","Erection drawings",
  "Model file","IFC background","Approved set","Other"];

const LANES = [
  { k:"house",    label:"In-house",      cssvar:"--lane-house" },
  { k:"review",   label:"With reviewer", cssvar:"--lane-review" },
  { k:"released", label:"Released",      cssvar:"--lane-released" }
];
const AGE_BUCKETS = [
  { label:"0–7 days",   lo:0,  hi:7,        cssvar:"--st-good" },
  { label:"8–14 days",  lo:8,  hi:14,       cssvar:"--st-warn" },
  { label:"15–21 days", lo:15, hi:21,       cssvar:"--st-serious" },
  { label:"22+ days",   lo:22, hi:1e9,      cssvar:"--st-crit" }
];

/* ============================ state ============================ */
const state = {
  db:null, dl:null, booted:false, conn:"connecting", canWrite:true,
  projects:[], packages:[], files:{},
  view:"portfolio", fProject:"all", fStatus:"all", fBic:"all", fType:"all", fFlag:"all", fBucket:null, q:"",
  sortKey:null, sortDir:"asc",
  openPkg:null, openFiles:[],
  who: (localStorage.getItem(WHO_KEY) || "").slice(0,40)
};

/* ============================ small helpers ============================ */
const $  = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const attr = s => esc(s);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const ms = iso => { if (!iso) return null; const t = Date.parse(iso + "T00:00:00"); return isNaN(t) ? null : t; };
const dayDiff = (a, b) => { const x = ms(a), y = ms(b); return (x == null || y == null) ? null : Math.round((y - x) / 864e5); };
function addDays(iso, n){ const t = ms(iso); if (t == null) return ""; return new Date(t + n*864e5).toISOString().slice(0,10); }
function fmtDate(iso){ if (!iso) return ""; const t = ms(iso); if (t == null) return iso;
  const d = new Date(t); return String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0") + "/" + String(d.getFullYear()).slice(2); }
const kb = n => n >= 1024*1024 ? (n/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n/1024)) + " KB";
const statusOf = k => STATUSES.find(s => s.k === k) || STATUSES[0];
const codeOf   = k => CODES.find(c => c.k === (k || "")) || CODES[0];
const projOf   = id => state.projects.find(p => p.id === id) || null;
const sortedProjects = () => state.projects.slice().sort((a, b) =>
  ((a.sortIndex || 0) - (b.sortIndex || 0)) || String(a.name || "").localeCompare(String(b.name || "")));
const projectOpts = () => sortedProjects().map(p => ({ v:p.id, t:p.name || "Untitled project" }));
function themeMode(){ try { return localStorage.getItem(THEME_KEY) || "system"; } catch(_){ return "system"; } }
const pkgOf    = id => state.packages.find(p => p.id === id) || null;
const initials = n => (String(n||"").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("") || "—").toUpperCase();
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* The artifact frame is sandboxed without allow-modals, so window.confirm /
   window.prompt silently return without showing anything — every destructive
   action and the name entry has to run through an in-page dialog instead. */
let dlgResolve = null;
function closeDialog(v){
  const m = document.getElementById("modal");
  if (m) m.innerHTML = "";
  const r = dlgResolve; dlgResolve = null;
  if (r) r(v);
}
function openDialog(o){
  return new Promise(res => {
    closeDialog(null);
    dlgResolve = res;
    document.getElementById("modal").innerHTML =
      '<div class="scrim" data-mact="cancel"></div>' +
      '<div class="dialog' + (o.wide ? " wide" : "") + '" role="dialog" aria-modal="true" aria-label="' + attr(o.title) + '">' +
        "<h3>" + esc(o.title) + "</h3>" +
        (o.body ? "<p>" + esc(o.body) + "</p>" : "") +
        (o.input ? '<div class="dlg-input"><input type="text" id="dlg-input" value="' + attr(o.value || "") +
          '" placeholder="' + attr(o.placeholder || "") + '" maxlength="40"></div>' : "") +
        (o.text != null ? '<div class="dlg-input"><textarea class="out" id="dlg-text" spellcheck="false">' + esc(o.text) + "</textarea></div>" : "") +
        (o.select ? '<div class="dlg-input"><select id="dlg-select">' + o.select.map(x =>
          '<option value="' + attr(x.v) + '"' + (String(x.v) === String(o.value || "") ? " selected" : "") + ">" +
          esc(x.t) + "</option>").join("") + "</select></div>" : "") +
        '<div class="dlg-foot">' +
          (o.extra ? '<button class="btn" data-act="' + attr(o.extra.act) + '">' + esc(o.extra.label) + "</button>" : "") +
          (o.hideCancel ? "" : '<button class="btn" data-mact="cancel">Cancel</button>') +
          '<button class="btn ' + (o.danger ? "danger" : "primary") + '" data-mact="ok">' + esc(o.ok || "OK") + "</button>" +
        "</div></div>";
    setTimeout(() => {
      const el = o.input ? document.getElementById("dlg-input")
        : o.select ? document.getElementById("dlg-select")
        : document.querySelector('#modal [data-mact="ok"]');
      if (el){ el.focus(); if (o.input && el.select) el.select(); }
    }, 30);
  });
}
function dialogOk(){
  const inp = document.getElementById("dlg-input");
  if (inp) return closeDialog(inp.value.trim());
  const sel = document.getElementById("dlg-select");
  closeDialog(sel ? sel.value : true);
}

function toast(msg, bad){
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), bad ? 6000 : 3200);
}

/* ============================ derivations ============================ */
function reviewDays(p){ const pr = projOf(p.projectId); const n = pr && Number(pr.reviewDays); return (n > 0 ? n : 14); }
function effDue(p){ return p.due || (p.submitted ? addDays(p.submitted, reviewDays(p)) : ""); }
function dueIsAuto(p){ return !p.due && !!p.submitted; }
function withReviewer(p){ return p.status === "submitted" || p.status === "in_review"; }
function isLive(p){ return p.status !== "void"; }
function daysOut(p){
  if (!p.submitted) return null;
  if (p.returned) return dayDiff(p.submitted, p.returned);
  return dayDiff(p.submitted, todayISO());
}
function daysToDue(p){ const d = effDue(p); return d ? dayDiff(todayISO(), d) : null; }
function isOverdue(p){ const n = daysToDue(p); return withReviewer(p) && n != null && n < 0; }
function isDueSoon(p){ const n = daysToDue(p); return withReviewer(p) && n != null && n >= 0 && n <= 3; }
function isBlocked(p){ return !!String(p.holds || "").trim() && p.status !== "released" && isLive(p); }
/* The OFS date is the detailer's deadline to us, so it only runs until the
   package is actually submitted — after that the reviewer owns the clock. */
function awaitingOfs(p){ return !p.submitted && p.status !== "released" && isLive(p); }
function daysToOfs(p){ return p.ofsDue ? dayDiff(todayISO(), p.ofsDue) : null; }
function isLateFromOfs(p){ const n = daysToOfs(p); return awaitingOfs(p) && n != null && n < 0; }
function isOfsDueSoon(p){ const n = daysToOfs(p); return awaitingOfs(p) && n != null && n >= 0 && n <= 3; }
function needsResubmit(p){ return p.status === "returned" && (p.code === "RR" || p.code === "REJ"); }
function laneOf(p){ return statusOf(p.status).lane; }

function scopedPackages(){
  return state.packages.filter(p => state.fProject === "all" || p.projectId === state.fProject);
}
function actionReasons(p){
  const out = [];
  if (isOverdue(p))     out.push({ k:"overdue",  t:"Overdue with reviewer " + Math.abs(daysToDue(p)) + "d", css:"--st-crit" });
  if (isLateFromOfs(p)) out.push({ k:"ofs",      t:"Late from OFS " + Math.abs(daysToOfs(p)) + "d", css:"--st-crit" });
  if (needsResubmit(p)) out.push({ k:"resubmit", t:"Returned " + codeOf(p.code).short + " — resubmit due", css:"--st-serious" });
  if (isBlocked(p))     out.push({ k:"blocked",  t:"Held: " + String(p.holds).trim(), css:"--st-warn" });
  if (!isOverdue(p) && isDueSoon(p)) out.push({ k:"due", t:"Due back in " + daysToDue(p) + "d", css:"--st-warn" });
  if (!isLateFromOfs(p) && isOfsDueSoon(p)) out.push({ k:"ofsdue", t:"Due from OFS in " + daysToOfs(p) + "d", css:"--st-warn" });
  return out;
}
function turnaroundSamples(list){
  const out = [];
  list.forEach(p => {
    (p.history || []).forEach(h => { const d = dayDiff(h.submitted, h.returned); if (d != null && d >= 0) out.push(d); });
    if (p.submitted && p.returned){ const d = dayDiff(p.submitted, p.returned); if (d != null && d >= 0) out.push(d); }
  });
  return out;
}

const SORTS = {
  num:       p => String(p.num || ""),
  job:       p => (projOf(p.projectId) || {}).name || "",
  title:     p => String(p.title || ""),
  spec:      p => String(p.spec || ""),
  type:      p => String(p.type || ""),
  seq:       p => String(p.seq || ""),
  sheets:    p => Number(p.sheets) || 0,
  rev:       p => Number(p.rev) || 0,
  status:    p => STATUSES.findIndex(x => x.k === p.status),
  code:      p => CODES.findIndex(x => x.k === (p.code || "")),
  bic:       p => String(p.bic || ""),
  ofsDue:    p => p.ofsDue || "",
  submitted: p => p.submitted || "",
  due:       p => effDue(p) || "",
  returned:  p => p.returned || "",
  days:      p => daysOut(p) == null ? -1 : daysOut(p)
};

/* ============================ persistence ============================ */
function stamp(patch){
  patch.updatedAt = new Date().toISOString();
  if (state.who) patch.updatedBy = state.who;
  return patch;
}
function writeFailed(err){
  const code = (err && err.code) || "unavailable";
  if (code === "invalid_argument" || code === "not_granted"){
    state.canWrite = false; render();
    toast("Write refused — your access to this tracker looks view-only.", true);
  } else if (code === "quota_exceeded"){
    toast("The tracker's document limit is full. Delete old packages or attachments first.", true);
  } else {
    toast("Couldn't save that change (" + code + "). Try again.", true);
  }
}
async function patchPkg(id, patch){
  const p = pkgOf(id); if (!p) return;
  Object.assign(p, patch);                       /* optimistic */
  if (!state.db) return;
  try { await state.db.doc("packages/" + id).update(stamp(patch)); } catch(e){ writeFailed(e); }
}
async function patchProject(id, patch){
  const pr = projOf(id); if (!pr) return;
  Object.assign(pr, patch);
  if (!state.db) return;
  try { await state.db.doc("projects/" + id).update(stamp(patch)); } catch(e){ writeFailed(e); }
}

const debounces = {};
function patchDebounced(kind, id, patch, key){
  const p = (kind === "pkg" ? pkgOf(id) : projOf(id)); if (p) Object.assign(p, patch);
  const dk = kind + ":" + id + ":" + key;
  clearTimeout(debounces[dk]);
  debounces[dk] = setTimeout(() => { (kind === "pkg" ? patchPkg : patchProject)(id, patch); }, 450);
}

function suggestNum(projectId){
  const nums = state.packages.filter(p => p.projectId === projectId).map(p => String(p.num || "")).filter(Boolean);
  if (!nums.length) return "S-001";
  let max = 0, width = 3, prefix = "S-";
  nums.forEach(n => { const m = n.match(/^(.*?)(\d+)\s*$/); if (m){ const v = parseInt(m[2],10); if (v >= max){ max = v; width = m[2].length; prefix = m[1]; } } });
  return prefix + String(max + 1).padStart(width, "0");
}

async function createProject(){
  if (!state.db) return toast("Not connected to the shared store yet.", true);
  const id = uid();
  const body = stamp({ name:"New project", number:"", gc:"", eor:"", city:"",
    reviewDays:14, archived:false, sortIndex:state.projects.length, createdAt:new Date().toISOString() });
  try {
    await state.db.doc("projects/" + id).set(body);
    state.view = "projects"; render();
    setTimeout(() => { const el = document.querySelector('[data-fk="proj:' + id + ':name"]'); if (el){ el.focus(); el.select && el.select(); } }, 60);
  } catch(e){ writeFailed(e); }

/* ============================ attachments ============================ */
function pickFile(pkgId){
  if (!state.db) return toast("Not connected to the shared store.", true);
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = FILE_OK;
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (f.size > FILE_CAP){
      toast("“" + f.name + "” is " + kb(f.size) + ". Files stored here are capped at " + kb(FILE_CAP) +
        " — link the full set instead.", true);
      return;
    }
    try {
      const b64 = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => { const s = String(fr.result); res(s.slice(s.indexOf(",") + 1)); };
        fr.onerror = () => rej(new Error("read"));
        fr.readAsDataURL(f);
      });
      const fid = uid();
      await state.db.doc("files/" + fid).set({ packageId:pkgId, name:f.name, size:f.size,
        mime:f.type || "application/octet-stream", b64, addedAt:new Date().toISOString(), addedBy:state.who || "" });
      const p = pkgOf(pkgId);
      const files = (p.files || []).concat([{ id:fid, name:f.name, size:f.size }]);
      await patchPkg(pkgId, { files });
      toast("Attached " + f.name + " (" + kb(f.size) + ").");
    } catch(e){ writeFailed(e); }
  });
  inp.click();
}
async function downloadFile(fid, name){
  if (!state.db) return toast("Not connected to the shared store.", true);
  if (!state.dl) return toast("Saving files isn't available in this view.", true);
  try {
    const snap = await state.db.doc("files/" + fid).get();
    if (!snap.exists) return toast("That attachment is no longer in the tracker.", true);
    const b64 = String(snap.data().b64 || "");
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    await state.dl.save({ filename:name, data:arr.buffer });
  } catch(e){
    const c = (e && e.code) || "";
    if (c === "declined") return;
    if (c === "rejected_extension") return toast("That file type can't be saved from a published page.", true);
    toast("Couldn't hand over that file (" + (c || "error") + ").", true);
  }
}
async function removeFile(pkgId, fid){
  const p = pkgOf(pkgId); if (!p || !state.db) return;
  await patchPkg(pkgId, { files:(p.files || []).filter(f => f.id !== fid) });
  try { await state.db.doc("files/" + fid).delete(); } catch(_){}
}

/* The follow-up nobody wants to retype at 6am. */
let chaseBuffer = "";
function buildChase(){
  const late = scopedPackages().filter(p => isLive(p) && isOverdue(p))
    .sort((a,b) => (daysToDue(a) || 0) - (daysToDue(b) || 0));
  if (!late.length) return "";
  const byProj = {};
  late.forEach(p => (byProj[p.projectId] = byProj[p.projectId] || []).push(p));
  const out = [];
  Object.keys(byProj).forEach(pid => {
    const pr = projOf(pid) || {};
    const items = byProj[pid];
    out.push("Subject: " + (pr.number ? pr.number + " " : "") + (pr.name || "Project") + " — overdue submittal returns (" + items.length + ")");
    out.push("");
    out.push((pr.gc ? pr.gc : "Team") + ",");
    out.push("");
    out.push("Following up on the submittals below. Contract review period is " + (Number(pr.reviewDays) || 14) +
      " calendar days; each of these is past that. Fabrication release is held until they come back.");
    out.push("");
    items.forEach(p => {
      out.push("  " + (p.num || "—") + "  " + (p.title || "Untitled") +
        (p.spec ? "  [" + p.spec + "]" : "") +
        (Number(p.sheets) ? "  (" + p.sheets + " sheets)" : ""));
      out.push("      submitted " + fmtDate(p.submitted) + " · due " + fmtDate(effDue(p)) +
        " · " + Math.abs(daysToDue(p)) + " days past due · with " + (p.bic || "reviewer") +
        (p.reviewer ? " (" + p.reviewer + ")" : ""));
    });
    out.push("");
    out.push("Please advise on a return date for each so we can hold the fabrication and erection sequence.");
    out.push("");
    out.push("Thanks,");
    out.push(state.who || "");
    out.push("S&H Steel Co.");
    out.push("");
    out.push("— — —");
    out.push("");
  });
  return out.join("\n").trim();
}

/* ============================ filtering ============================ */
function filteredRows(){
  const q = state.q.trim().toLowerCase();
  return scopedPackages().filter(p => {
    if (state.fStatus !== "all" && p.status !== state.fStatus) return false;
    if (state.fBic !== "all" && (p.bic || "") !== state.fBic) return false;
    if (state.fType !== "all" && (p.type || "") !== state.fType) return false;
    if (state.fFlag === "overdue"  && !isOverdue(p)) return false;
    if (state.fFlag === "reviewer" && !withReviewer(p)) return false;
    if (state.fFlag === "blocked"  && !isBlocked(p)) return false;
    if (state.fFlag === "resubmit" && !needsResubmit(p)) return false;
    if (state.fFlag === "released" && !p.released) return false;
    if (state.fFlag === "ofs"      && !isLateFromOfs(p)) return false;
    if (state.fFlag === "flagged"  && !actionReasons(p).length) return false;
    if (state.fBucket){
      const d = daysOut(p);
      if (!withReviewer(p) || d == null || d < state.fBucket[0] || d > state.fBucket[1]) return false;
    }
    if (q){
      const pr = projOf(p.projectId) || {};
      const hay = [p.num, p.title, p.spec, p.type, p.seq, p.reviewer, p.holds, p.notes, pr.name, pr.number]
        .join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort((a, b) => {
    if (state.sortKey && SORTS[state.sortKey]){
      const f = SORTS[state.sortKey], va = f(a), vb = f(b);
      const c = (typeof va === "number" && typeof vb === "number")
        ? va - vb : String(va).localeCompare(String(vb), undefined, { numeric:true });
      return state.sortDir === "desc" ? -c : c;
    }
    const pa = projOf(a.projectId), pb = projOf(b.projectId);
    const sa = (pa ? pa.sortIndex : 99), sb = (pb ? pb.sortIndex : 99);
    if (sa !== sb) return sa - sb;
    return String(a.num || "").localeCompare(String(b.num || ""), undefined, { numeric:true });
  });
}

/* ============================ render: portfolio ============================ */
function kpiStrip(list){
  const live = list.filter(isLive);
  const open = live.filter(p => p.status !== "released");
  const rev  = live.filter(withReviewer);
  const over = rev.filter(isOverdue);
  const rel  = live.filter(p => p.released || p.status === "released");
  const held = live.filter(isBlocked);
  const lateOfs = live.filter(isLateFromOfs);
  const ta   = turnaroundSamples(live);
  const avg  = ta.length ? Math.round(ta.reduce((a,b) => a+b, 0) / ta.length) : null;
  const relSheets = rel.reduce((a,p) => a + (Number(p.sheets) || 0), 0);
  const allSheets = live.reduce((a,p) => a + (Number(p.sheets) || 0), 0);
  const pct  = live.length ? Math.round(rel.length / live.length * 100) : 0;
  const oldest = rev.length ? Math.max.apply(null, rev.map(p => daysOut(p) || 0)) : 0;
  const tiles = [
    { l:"Open packages", v:open.length, s:live.length + " tracked · " + allSheets + " sheets" },
    { l:"With reviewer", v:rev.length,  s:rev.length ? "oldest " + oldest + " days out" : "nothing out" },
    { l:"Overdue",       v:over.length, s:over.length ? "past contract review days" : "all inside the window", cls:over.length ? "alert" : "" },
    { l:"Avg turnaround", v:(avg == null ? "—" : avg), u:(avg == null ? "" : "days"), s:ta.length ? ta.length + " completed cycles" : "no returns logged yet" },
    { l:"Released for fab", v:pct, u:"%", s:rel.length + " of " + live.length + " · " + relSheets + " sheets", cls:pct >= 60 ? "good" : "" },
    { l:"Late from OFS", v:lateOfs.length, s:lateOfs.length ? "past the detailer's due date" : "detailer on schedule", cls:lateOfs.length ? "alert" : "" },
    { l:"Held / blocked", v:held.length, s:held.length ? "open RFI or hold on record" : "no holds recorded", cls:held.length ? "warn" : "" }
  ];
  return '<div class="kpis">' + tiles.map(t =>
    '<div class="kpi ' + (t.cls || "") + '"><span class="l">' + esc(t.l) + "</span>" +
    '<span class="v">' + esc(t.v) + (t.u ? '<span class="u">' + esc(t.u) + "</span>" : "") + "</span>" +
    '<span class="s">' + esc(t.s) + "</span></div>").join("") + "</div>";
}

function agingPanel(list){
  const out = list.filter(p => isLive(p) && withReviewer(p) && p.submitted);
  const buckets = AGE_BUCKETS.map(b => ({ b, items: out.filter(p => {
    const d = daysOut(p); return d != null && d >= b.lo && d <= b.hi; }) }));
  const max = Math.max(1, ...buckets.map(x => x.items.length));
  const scope = state.fProject === "all" ? null : projOf(state.fProject);
  const cols = buckets.map(x => {
    const n = x.items.length, h = n ? Math.max(6, Math.round(n / max * 90)) : 3;
    const tip = n ? x.b.label + ": " + x.items.slice(0,6).map(p => p.num).join(", ") + (n > 6 ? " +" + (n-6) + " more" : "") : "Nothing in this bucket";
    return '<div class="col"><span class="cnt">' + n + "</span>" +
      '<button class="bar' + (n ? "" : " empty") + '" style="height:' + h + "px;background:var(" + x.b.cssvar + ')" ' +
      'data-act="bucket" data-lo="' + x.b.lo + '" data-hi="' + x.b.hi + '" title="' + attr(tip) + '" aria-label="' + attr(x.b.label + ": " + n + " packages") + '"></button></div>';
  }).join("");
  return '<section class="panel"><div class="panel-head"><h3>Review aging</h3>' +
    '<span class="hint">' + out.length + " with the reviewer" +
    (scope ? " · " + (Number(scope.reviewDays) || 14) + "-day contract review" : "") + "</span></div>" +
    '<div class="panel-body">' +
      (out.length
        ? '<div class="chart">' + cols + '</div><div class="chart-x">' +
          AGE_BUCKETS.map(b => '<span class="lx">' + esc(b.label) + "</span>").join("") + "</div>" +
          '<p style="margin:12px 0 0;font-size:11.5px;color:var(--muted)">Calendar days since submitted. Click a bar to filter the log.</p>'
        : '<div class="empty-note">Nothing is out for review right now.</div>') +
    "</div></section>";
}

function actionPanel(list){
  const rows = [];
  list.filter(isLive).forEach(p => { const rs = actionReasons(p); if (rs.length) rows.push({ p, r:rs[0], n:rs.length }); });
  const order = { overdue:0, ofs:1, resubmit:2, blocked:3, due:4, ofsdue:5 };
  rows.sort((a,b) => (order[a.r.k] - order[b.r.k]) || (Math.abs(daysToDue(b.p) || 0) - Math.abs(daysToDue(a.p) || 0)));
  const shown = rows.slice(0, 9);
  return '<section class="panel"><div class="panel-head"><h3>Needs action</h3>' +
    '<span class="hint">' + rows.length + " flagged</span></div>" +
    (shown.length ? '<div class="acts">' + shown.map(x => {
      const pr = projOf(x.p.projectId) || {};
      return '<button class="act" data-act="openpkg" data-id="' + attr(x.p.id) + '">' +
        '<span class="why" style="background:var(' + x.r.css + ')"></span>' +
        '<span class="t"><b>' + esc(x.p.num || "—") + "  " + esc(x.p.title || "Untitled") + "</b>" +
        "<span>" + esc(pr.name || "") + " · " + esc(x.r.t) + (x.n > 1 ? " (+" + (x.n-1) + " more)" : "") + "</span></span>" +
        statusPill(x.p) + "</button>";
    }).join("") + "</div>"
      : '<div class="empty-note">Nothing flagged — no overdue reviews, resubmits, or holds.</div>') +
    (rows.length > shown.length
      ? '<div style="padding:10px 14px;border-top:1px solid var(--line)"><button class="btn sm" data-act="showflag">See all ' + rows.length + " in the log</button></div>" : "") +
    "</section>";
}

/* Who is sitting on work, and how long they actually take against the contract. */
function scorecardPanel(list){
  const live = list.filter(isLive);
  const byCourt = {};
  live.forEach(p => {
    const k = p.bic || "Unassigned";
    const b = byCourt[k] || (byCourt[k] = { k, holding:0, overdue:0, samples:[] });
    if (withReviewer(p) || p.status !== "released") b.holding++;
    if (isOverdue(p)) b.overdue++;
    (p.history || []).forEach(h => { const d = dayDiff(h.submitted, h.returned); if (d != null && d >= 0) b.samples.push(d); });
    if (p.submitted && p.returned){ const d = dayDiff(p.submitted, p.returned); if (d != null && d >= 0) b.samples.push(d); }
  });
  const rows = Object.values(byCourt).filter(b => b.holding || b.samples.length)
    .sort((a,b) => (b.overdue - a.overdue) || (b.holding - a.holding));
  const contract = state.fProject === "all" ? 14 : (Number((projOf(state.fProject) || {}).reviewDays) || 14);
  return '<section class="panel"><div class="panel-head"><h3>Ball-in-court scorecard</h3>' +
    '<span class="hint">turnaround vs ' + contract + "-day contract</span></div>" +
    (rows.length
      ? '<div class="panel-body" style="padding:14px 4px 4px"><table class="mini"><thead><tr>' +
        '<th>Court</th><th class="n">Holding</th><th class="n">Overdue</th><th class="n">Avg days</th><th style="width:90px">vs contract</th>' +
        "</tr></thead><tbody>" + rows.map(b => {
          const avg = b.samples.length ? Math.round(b.samples.reduce((x,y) => x+y, 0) / b.samples.length) : null;
          const ratio = avg == null ? 0 : Math.min(1.6, avg / contract);
          const col = avg == null ? "--track" : ratio > 1 ? "--st-crit" : ratio > .8 ? "--st-warn" : "--st-good";
          return "<tr><td>" + esc(b.k) + '</td><td class="n">' + b.holding + "</td>" +
            '<td class="n"' + (b.overdue ? ' style="color:var(--st-crit);font-weight:600"' : "") + ">" + b.overdue + "</td>" +
            '<td class="n">' + (avg == null ? "—" : avg) + "</td>" +
            '<td><span class="meter" title="' + attr(avg == null ? "no completed cycles" : avg + " days vs " + contract + "-day contract") +
            '"><i style="width:' + Math.round(Math.min(1, ratio/1.6) * 100) + "%;background:var(" + col + ')"></i></span></td></tr>';
        }).join("") + "</tbody></table></div>"
      : '<div class="empty-note">No cycles logged yet — turnaround appears once packages come back.</div>') +
    "</section>";
}

/* What lands on the desk this week and next, so nothing is a surprise. */
function forecastPanel(list){
  const out = list.filter(p => isLive(p) && withReviewer(p) && effDue(p));
  const bands = [
    { t:"Overdue",      lo:-9999, hi:-1, css:"--st-crit" },
    { t:"Due today",    lo:0,     hi:0,  css:"--st-warn" },
    { t:"This week",    lo:1,     hi:7,  css:"--st-warn" },
    { t:"Next week",    lo:8,     hi:14, css:"--lane-house" },
    { t:"Beyond",       lo:15,    hi:9999, css:"--st-good" }
  ].map(b => ({ ...b, items: out.filter(p => { const n = daysToDue(p); return n != null && n >= b.lo && n <= b.hi; }) }))
   .filter(b => b.items.length);
  return '<section class="panel"><div class="panel-head"><h3>Return forecast</h3>' +
    '<span class="hint">' + out.length + " awaiting return</span></div>" +
    (bands.length
      ? '<div class="panel-body" style="padding:14px 4px 4px"><table class="mini"><thead><tr>' +
        '<th>When</th><th>Packages</th><th class="n">Sheets</th></tr></thead><tbody>' +
        bands.map(b => "<tr><td><span class=\"pill\" style=\"background:transparent;color:var(" + b.css + ");padding-left:0\">" +
          '<span class="dot"></span>' + esc(b.t) + "</span></td>" +
          "<td>" + b.items.slice(0,4).map(p => '<button class="linkchip" data-act="openpkg" data-id="' + attr(p.id) + '">' + esc(p.num || "—") + "</button>").join(" ") +
          (b.items.length > 4 ? ' <span class="num" style="color:var(--muted)">+' + (b.items.length - 4) + "</span>" : "") + "</td>" +
          '<td class="n">' + b.items.reduce((a,p) => a + (Number(p.sheets) || 0), 0) + "</td></tr>").join("") +
        "</tbody></table></div>"
      : '<div class="empty-note">Nothing is out for review.</div>') +
    "</section>";
}

function quickChips(){
  const all = scopedPackages().filter(isLive);
  const defs = [
    { k:"all",      t:"All",            n:all.length,                                 sw:"" },
    { k:"flagged",  t:"Needs action",   n:all.filter(p => actionReasons(p).length).length, sw:"--st-serious" },
    { k:"overdue",  t:"Overdue",        n:all.filter(isOverdue).length,               sw:"--st-crit" },
    { k:"ofs",      t:"Late from OFS",  n:all.filter(isLateFromOfs).length,           sw:"--st-crit" },

function sevOf(p){
  if (isOverdue(p) || isLateFromOfs(p)) return "crit";
  if (needsResubmit(p) || isBlocked(p) || isDueSoon(p) || isOfsDueSoon(p)) return "warn";
  if (p.released) return "good";
  return "";
}

    '<span style="flex:1"></span><span class="eyebrow">' + projs.length + " project" + (projs.length===1?"":"s") + "</span></div>" +
    (projs.length ? projs.map(pr => {
      const pk = state.packages.filter(p => p.projectId === pr.id);
      return '<section class="panel section"><div class="panel-head"><h3>' + esc(pr.name || "Untitled project") + "</h3>" +
        '<span class="hint">' + pk.length + " packages · created " + fmtDate((pr.createdAt||"").slice(0,10)) + "</span></div>" +
        '<div class="panel-body"><div class="fgrid three">' +
          fldText("proj:" + pr.id + ":name", "Project name", pr.name) +
          fldText("proj:" + pr.id + ":number", "Job number", pr.number) +

          fldText("proj:" + pr.id + ":gc", "General contractor", pr.gc) +
          fldText("proj:" + pr.id + ":eor", "Engineer of record", pr.eor) +

function fldText(fk, label, v){
  return '<label class="fld"><span>' + esc(label) + '</span><input type="text" data-fk="' + attr(fk) + '" value="' + attr(v || "") + '"' + (state.canWrite?"":" disabled") + "></label>";
}
function fldNum(fk, label, v){
  return '<label class="fld"><span>' + esc(label) + '</span><input type="number" min="0" step="1" data-fk="' + attr(fk) + '" value="' + attr(v == null ? "" : v) + '"' + (state.canWrite?"":" disabled") + "></label>";
}
function fldDate(fk, label, v, hint){
  return '<label class="fld"><span>' + esc(label) + '</span><input type="date" data-fk="' + attr(fk) + '" value="' + attr(v || "") + '"' + (state.canWrite?"":" disabled") + ">" +
    (hint ? '<span style="font:400 11px/1.3 var(--font-body);color:var(--faint);text-transform:none;letter-spacing:0">' + esc(hint) + "</span>" : "") + "</label>";
}
function fldSel(fk, label, v, opts){
  return '<label class="fld"><span>' + esc(label) + "</span>" + selectHtml(fk, v, opts) + "</label>";
}

/* ============================ render: banners ============================ */
function banners(){
  let out = "";
  if (state.conn === "off"){
    out += '<div class="banner"><b>Offline copy.</b> This page can’t reach the shared store, so nothing you type here is saved. ' +
      "Open the published artifact link to load and edit the live tracker.</div>";
  }
  if (!state.canWrite){
    out += '<div class="banner"><b>View-only access.</b> You can read the log, but writes are being refused. ' +
      "Ask the tracker’s owner for edit access.</div>";
  }
  if (state.projects.some(p => p.demo)){
    out += '<div class="banner info"><span><b>Sample job loaded.</b> “' +
      esc((state.projects.find(p => p.demo) || {}).name || "") + '” is example data so the tracker isn’t empty — delete it once your real jobs are in.</span>' +
      '<button class="btn sm" data-act="rmdemo" style="margin-left:auto;flex:none">Remove sample data</button></div>';
  }
  return out;
}

            (h.code ? '<span class="pill ' + codeOf(h.code).tone + '">' + esc(codeOf(h.code).short) + "</span>" : '<span class="num" style="color:var(--faint)">—</span>') +
          "</div>").join("") + "</div>"
          : '<p style="margin:0;font-size:12px;color:var(--muted)">Rev ' + (Number(p.rev)||0) + " is the first cycle — no resubmits logged.</p>") +

      "</div>" +

    "</div>" +
    '<div class="drawer-foot">' +
      '<span class="stamp">' + (p.updatedBy ? "Last edited by " + esc(p.updatedBy) : "Last edited") +
        (p.updatedAt ? " · " + new Date(p.updatedAt).toLocaleString() : "") + "</span>" +
      '<button class="btn" data-act="transmittal" data-id="' + attr(p.id) + '">Transmittal</button>' +
      '<button class="btn danger" data-act="delpkg" data-id="' + attr(p.id) + '">Delete</button>' +
      '<button class="btn" data-act="closedrawer">Done</button>' +
    "</div>" +
  "</aside>";

/* ============================ render ============================ */
function captureFocus(){
  const ae = document.activeElement;
  if (!ae || !ae.dataset || !ae.dataset.fk) return null;
  const o = { fk: ae.dataset.fk };
  const t = (ae.type || "").toLowerCase();
  if ((ae.tagName === "TEXTAREA" || t === "text" || t === "url" || t === "search") && "selectionStart" in ae){
    o.val = ae.value; o.s = ae.selectionStart; o.e = ae.selectionEnd;
  }
  return o;
}
function restoreFocus(o){
  if (!o) return;
  let el = null;
  try { el = document.querySelector('[data-fk="' + (window.CSS && CSS.escape ? CSS.escape(o.fk) : o.fk) + '"]'); } catch(_){}
  if (!el) return;
  try { el.focus({ preventScroll:true }); } catch(_){ el.focus(); }
  if (o.val != null && "value" in el){ el.value = o.val; try { el.setSelectionRange(o.s, o.e); } catch(_){} }
}

let rendering = false;
function render(){
  if (rendering) return;
  rendering = true;
  const foc = captureFocus();
  const sy = window.scrollY;
  const tw = document.querySelector(".table-wrap"); const twx = tw ? tw.scrollLeft : 0;
  const dbEl = document.querySelector(".drawer-body"); const dby = dbEl ? dbEl.scrollTop : 0;

  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.view === state.view)));
  document.getElementById("mast-tools").innerHTML = mastTools();

  document.getElementById("view").innerHTML =
    state.view === "log" ? logHtml() : state.view === "projects" ? projectsHtml() : portfolioHtml();
  document.getElementById("overlay").innerHTML = drawerHtml();

  window.scrollTo(0, sy);
  const tw2 = document.querySelector(".table-wrap"); if (tw2) tw2.scrollLeft = twx;
  const db2 = document.querySelector(".drawer-body"); if (db2) db2.scrollTop = dby;
  restoreFocus(foc);
  const mh = document.querySelector(".masthead");
  if (mh) document.documentElement.style.setProperty("--mast-h", mh.offsetHeight + "px");
  rendering = false;
}

/* ============================ events ============================ */
function fieldWrite(fk, el){
  const parts = fk.split(":");
  const kind = parts[0];

  if (kind === "flt"){
    const which = parts[1];
    if (which === "project"){ state.fProject = el.value; }
    else if (which === "status"){ state.fStatus = el.value; }
    else if (which === "bic"){ state.fBic = el.value; }
    else if (which === "type"){ state.fType = el.value; }
    else if (which === "flag"){ state.fFlag = el.value; state.fBucket = null; }
    else if (which === "q"){ state.q = el.value; }
    render(); return;
  }
  if (!state.canWrite) return;

  if (kind === "link"){
    const id = parts[1], i = Number(parts[2]), part = parts[3];
    const p = pkgOf(id); if (!p) return;
    const links = (p.links || []).map(l => Object.assign({}, l));
    if (!links[i]) return;
    links[i][part] = el.value;
    p.links = links;
    patchDebounced("pkg", id, { links }, "links");
    return;
  }
  const id = parts[1], field = parts[2];
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (field === "sheets" || field === "rev" || field === "reviewDays") v = Math.max(0, Number(v) || 0);

  if (kind === "proj"){
    if (el.type === "text" || el.type === "number") patchDebounced("proj", id, { [field]: v }, field);
    else patchProject(id, { [field]: v });
    return;
  }
  if (kind === "pkg"){
    const patch = { [field]: v };
    const p = pkgOf(id);
    if (field === "released"){
      patch.releasedOn = v ? (p && p.releasedOn ? p.releasedOn : todayISO()) : "";
      if (v && p && p.status !== "released" && p.status !== "void") patch.status = "released";
    }
    if (field === "status"){
      if (v === "released"){ patch.released = true; if (p && !p.releasedOn) patch.releasedOn = todayISO(); }
      if ((v === "submitted") && p && !p.submitted) patch.submitted = todayISO();
      if (v === "returned" && p && !p.returned) patch.returned = todayISO();
    }
    if (field === "code" && v && p && !p.returned) patch.returned = todayISO();
    if (field === "returned" && v && p && (p.status === "submitted" || p.status === "in_review")) patch.status = "returned";
    if (field === "submitted" && v && p && (p.status === "not_started" || p.status === "detailing" || p.status === "internal")) patch.status = "submitted";

    const soft = (el.tagName === "TEXTAREA" || el.type === "text" || el.type === "url" || el.type === "number");
    if (soft) patchDebounced("pkg", id, patch, field);
    else { patchPkg(id, patch); render(); }
    return;
  }
}

document.addEventListener("input", e => {
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.fk) return;
  if (el.tagName === "SELECT" || el.type === "date" || el.type === "checkbox") return;
  fieldWrite(el.dataset.fk, el);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.fk) return;
  if (el.tagName === "SELECT" || el.type === "date" || el.type === "checkbox") fieldWrite(el.dataset.fk, el);
});
document.addEventListener("keydown", e => {
  if (dlgResolve){
    if (e.key === "Escape"){ e.preventDefault(); closeDialog(null); }
    else if (e.key === "Enter" && e.target && e.target.id === "dlg-input"){ e.preventDefault(); dialogOk(); }
    return;
  }
  if (e.key === "Escape" && state.openPkg){ state.openPkg = null; render(); }
});
document.addEventListener("click", e => {
  const m = e.target.closest && e.target.closest("[data-mact]");
  if (m){ if (m.dataset.mact === "ok") dialogOk(); else closeDialog(null); return; }
  const tab = e.target.closest && e.target.closest(".tab");
  if (tab){ state.view = tab.dataset.view; render(); return; }
  const el = e.target.closest && e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;

  if (a === "closedrawer"){ state.openPkg = null; render(); return; }
  if (a === "openpkg"){ state.openPkg = id; render(); return; }
  if (a === "scope"){ state.fProject = id; state.view = "log"; render(); return; }
  if (a === "newproj"){ createProject(); return; }
  if (a === "newpkg"){ createPackage(state.fProject); return; }
  if (a === "newpkgfor"){ createPackage(id); return; }
  if (a === "delpkg"){ deletePackage(id); return; }
  if (a === "delproj"){ deleteProject(id); return; }
  if (a === "rmdemo"){ removeSampleData(); return; }
  if (a === "export"){ exportCsv(); return; }
  if (a === "attach"){ pickFile(id); return; }
  if (a === "rmfile"){ removeFile(id, el.dataset.fid); return; }
  if (a === "dlfile"){ downloadFile(el.dataset.fid, el.dataset.name); return; }
  if (a === "nextrev"){ startNextRev(id); return; }
  if (a === "view-projects"){ state.view = "projects"; render(); return; }
  if (a === "sort"){
    const k = el.dataset.k;
    if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    else { state.sortKey = k; state.sortDir = "asc"; }
    render(); return;
  }
  if (a === "flag"){ state.fFlag = el.dataset.k; state.fBucket = null; render(); return; }
  if (a === "chase"){ showChase(); return; }
  if (a === "chase-save"){ saveChase(); return; }
  if (a === "transmittal"){ makeTransmittal(id); return; }
  if (a === "theme"){
    const cur = themeMode();
    const next = cur === "system" ? "light" : cur === "light" ? "dark" : "";
    try { if (next) localStorage.setItem(THEME_KEY, next); else localStorage.removeItem(THEME_KEY); } catch(_){}
    applyTheme(); render(); return;
  }
  if (a === "who"){
    openDialog({ title:"Who's editing?",
      body:"Your name stamps the changes you make, so the team can see who moved a package. Stored on this device only.",
      input:true, value:state.who, placeholder:"Nick Lortz", ok:"Save" }).then(v => {
        if (v == null) return;
        state.who = String(v).slice(0, 40);
        try { localStorage.setItem(WHO_KEY, state.who); } catch(_){}
        render();
      });
    return;
  }
  if (a === "showflag"){ state.view = "log"; state.fFlag = "flagged"; state.fBucket = null; render(); return; }
  if (a === "clearbucket"){ state.fBucket = null; render(); return; }
  if (a === "clearfilters"){ state.fStatus = "all"; state.fBic = "all"; state.fType = "all"; state.fFlag = "all"; state.q = ""; state.fBucket = null; render(); return; }
  if (a === "bucket"){
    state.view = "log"; state.fFlag = "all"; state.fStatus = "all"; state.fBic = "all"; state.fType = "all"; state.q = "";
    state.fBucket = [Number(el.dataset.lo), Number(el.dataset.hi)];
    render(); return;
  }
  if (a === "addlink"){
    const p = pkgOf(id); if (!p || !state.canWrite) return;
    const links = (p.links || []).concat([{ label:"Submitted set", url:"" }]);
    patchPkg(id, { links }).then(() => {
      render();
      const inp = document.querySelector('[data-fk="link:' + id + ":" + (links.length - 1) + ':url"]');
      if (inp) inp.focus();
    });
    return;
  }
  if (a === "dellink"){
    const p = pkgOf(id); if (!p || !state.canWrite) return;
    const links = (p.links || []).filter((_, i) => i !== Number(el.dataset.i));
    patchPkg(id, { links }).then(render);
    return;
  }
});

function applyTheme(){
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch(_){}
  const root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
}

/* ============================ boot ============================ */
async function boot(){
  applyTheme();
  render();
  const c = window.claude;
  if (!c || typeof c.use !== "function"){ state.conn = "off"; render(); return; }
  let db = null, dl = null;
  try { db = await c.use("db"); } catch(_){}
  try { dl = await c.use("downloads"); } catch(_){}
  state.dl = dl;
  if (!db){ state.conn = "off"; render(); return; }
  state.db = db;

  const onErr = err => {
    state.conn = "bad";
    if (err && (err.code === "revoked" || err.code === "not_granted")) state.canWrite = false;
    render();
  };
  db.collection("projects").onSnapshot(snap => {
    state.projects = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
    state.conn = "on"; render();
  }, onErr);
  db.collection("packages").onSnapshot(snap => {
    state.packages = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
    state.conn = "on"; render();
  }, onErr);
}
boot();
})();
</script>
