name: Drawing cutover staging evidence
run-name: Drawing staging ${{ inputs.phase }} for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed main ancestor with four passing source jobs
        required: true
        type: string
      phase:
        description: Source-guarded staging evidence or foundation only; no SQL/deployment
        required: true
        type: choice
        options: [preflight, acceptance, setup-bootstrap, setup-complete]
      fixture_manifest_sha256:
        description: Independently reviewed exact private fixture manifest digest
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: drawing-cutover-staging
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.source.outputs.candidate_sha }}
    steps:
      - id: source
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PHASE: ${{ inputs.phase }}
          MANIFEST_SHA: ${{ inputs.fixture_manifest_sha256 }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main' || context.eventName !== 'workflow_dispatch') throw new Error('MAIN_DISPATCH_REQUIRED');
            const sha = process.env.CANDIDATE_SHA;
            const phase = process.env.PHASE;
            const setup = ['setup-bootstrap', 'setup-complete'].includes(phase);
            const inputs = context.payload?.inputs || {};
            if (Object.keys(inputs).some(name => !['candidate_sha', 'phase', 'fixture_manifest_sha256'].includes(name)) ||
                !/^[a-f0-9]{40}$/.test(sha || '') || !['preflight', 'acceptance', 'setup-bootstrap', 'setup-complete'].includes(phase) ||
                (setup ? !!process.env.MANIFEST_SHA : !/^[a-f0-9]{64}$/.test(process.env.MANIFEST_SHA || ''))) throw new Error('EXACT_INPUTS_REQUIRED');
            if (setup && String(context.runAttempt) !== '1') throw new Error('SETUP_RERUN_REFUSED');
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${sha}...${context.sha}` });
            if (comparison.merge_base_commit?.sha !== sha) throw new Error('MAIN_ANCESTOR_REQUIRED');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { ...context.repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 100 });
            const required = ['Lint + Typecheck + Test + Build', 'Secret scan (gitleaks)', 'Release Edge Function typecheck', 'Commercial SQL + concurrent PostgreSQL acceptance'];
            let verified = false;
            for (const run of runs) {
              if (run.head_sha !== sha || run.event !== 'push' || run.status !== 'completed') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: run.id, per_page: 100 });
              if (required.every(name => jobs.some(job => job.name === name && job.conclusion === 'success'))) { verified = true; break; }
            }
            if (!verified) throw new Error('EXACT_SOURCE_CHECKS_REQUIRED');
            // Manual approval/digests do not establish the missing Task 13 source readiness.
            if (setup) throw new Error('SETUP_PREREQUISITES_UNPROVED');
            core.setOutput('candidate_sha', sha);

  build:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: staging-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Build exact source for fixed staging
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_E2E_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ needs.verify.outputs.candidate_sha }}
        run: |
          node --input-type=module -e "import {validatePublicStage} from './scripts/drawing-cutover-staging.ts'; try {validatePublicStage(process.env.VITE_SUPABASE_URL,process.env.VITE_SUPABASE_ANON_KEY)} catch {console.error('PUBLIC_STAGING_BUILD_BINDING_REQUIRED');process.exit(1)}"
          npm run build
          node --input-type=module -e "import {sealBuild} from './scripts/drawing-cutover-staging.ts'; sealBuild(process.env.VITE_APP_VERSION)"
      - id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: drawing-cutover-build-${{ needs.verify.outputs.candidate_sha }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  evidence:
    needs: [verify, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.phase == 'preflight' || inputs.phase == 'acceptance')
    environment: staging-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Complete tooling before injecting actor/manifest secrets; no install hooks.
      - run: npm ci --ignore-scripts
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify immutable build handoff
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          E2E_SUPABASE_URL: ${{ secrets.STAGING_E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.STAGING_E2E_SUPABASE_ANON_KEY }}
        run: node --input-type=module -e "import {verifyBuild,validatePublicStage,safeFailure} from './scripts/drawing-cutover-staging.ts'; import {digest} from './e2e/drawing-cutover-setup.ts'; try {verifyBuild(process.env.CANDIDATE_SHA,digest(validatePublicStage(process.env.E2E_SUPABASE_URL,process.env.E2E_SUPABASE_ANON_KEY)))} catch(error) {console.error(safeFailure(error));process.exit(1)}"
      - name: Guarded evidence (INCOMPLETE fails; no setup authority)
        env:
          DRAWING_CUTOVER_ENABLED: 'true'
          DRAWING_CUTOVER_CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          DRAWING_CUTOVER_PHASE: ${{ inputs.phase }}
          DRAWING_CUTOVER_MANIFEST_SHA256: ${{ inputs.fixture_manifest_sha256 }}
          DRAWING_CUTOVER_FIXTURE_JSON: ${{ secrets.STAGING_DRAWING_FIXTURE_MANIFEST }}
          DRAWING_CUTOVER_ACTORS: ${{ secrets.STAGING_DRAWING_ACTORS }}
          E2E_SUPABASE_URL: ${{ secrets.STAGING_E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.STAGING_E2E_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module -e "import {writePrivateManifestFromEnvironment} from './scripts/drawing-cutover-staging.ts'; try {writePrivateManifestFromEnvironment()} catch {console.error('PRIVATE_FIXTURE_REFUSED');process.exit(1)}"
          node scripts/drawing-cutover-staging.ts --target=staging --expected-ref=ndyfjffsulfbwpmwdmic --candidate-sha="$DRAWING_CUTOVER_CANDIDATE_SHA" --phase="$DRAWING_CUTOVER_PHASE" --fixture=e2e/.auth/drawing-cutover/fixture.json
          if [ "$DRAWING_CUTOVER_PHASE" = acceptance ]; then
            node node_modules/@playwright/test/cli.js test --config playwright.drawing-cutover.config.ts
          fi
      - name: Retain only schema-sanitized evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: drawing-cutover-evidence-${{ needs.verify.outputs.candidate_sha }}-${{ github.run_id }}
          path: |
            test-results/drawing-cutover/preflight.json
            test-results/drawing-cutover/summary.json
          if-no-files-found: error
          retention-days: 7

  # Dormant until separately reviewed Task 13 readiness replaces all real stops.
  # Environment origin/reviewer/bypass and secret timing need independent live proof.
  setup:
    needs: [verify, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.phase == 'setup-bootstrap' || inputs.phase == 'setup-complete')
    environment: staging-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify immutable build before private inputs
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          E2E_SUPABASE_URL: ${{ secrets.STAGING_E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.STAGING_E2E_SUPABASE_ANON_KEY }}
        run: node --input-type=module -e "import {verifyBuild,validatePublicStage} from './scripts/drawing-cutover-staging.ts'; import {digest} from './e2e/drawing-cutover-setup.ts'; try {verifyBuild(process.env.CANDIDATE_SHA,digest(validatePublicStage(process.env.E2E_SUPABASE_URL,process.env.E2E_SUPABASE_ANON_KEY)))} catch {console.error('SETUP_BUILD_REFUSED');process.exit(1)}"
      - id: stage-bootstrap
        if: inputs.phase == 'setup-bootstrap'
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          PHASE: ${{ inputs.phase }}
          SETUP_PLAN: ${{ secrets.STAGING_DRAWING_SETUP_PLAN }}
          SETUP_PLAN_SHA256: ${{ secrets.STAGING_DRAWING_SETUP_PLAN_SHA256 }}
          RECOVERY_PUBLIC_KEY: ${{ vars.STAGING_DRAWING_RECOVERY_PUBLIC_KEY }}
        with:
          script: &stage-private-inputs |
            try {
              const { mkdir } = await import('node:fs/promises');
              const { join } = await import('node:path');
              const { createPublicKey } = await import('node:crypto');
              const { requireSetupTransportSize, requireFoundationPlan, setupRunPaths } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/drawing-cutover-provision.ts`);
              const { validateSetupPlan, validateSetupResume, digest, STAGE_REF } = await import(`${process.env.GITHUB_WORKSPACE}/e2e/drawing-cutover-setup.ts`);
              const { writePrivateJson } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/drawing-cutover-recovery.ts`);
              const env = process.env;
              if (env.GITHUB_REPOSITORY !== 'lorteezy87/SteelBuild-Pro-Rev.2' || env.GITHUB_RUN_ATTEMPT !== '1') throw new Error();
              const raw = env.SETUP_PLAN || ''; requireSetupTransportSize(raw);
              const untrusted = JSON.parse(raw);
              const recipientSha256 = digest(createPublicKey(env.RECOVERY_PUBLIC_KEY).export({ format: 'der', type: 'spki' }));
              const expected = { ...untrusted.context, projectRef: STAGE_REF, candidateSha: env.CANDIDATE_SHA, workflowRunId: env.GITHUB_RUN_ID,
                workflowRunAttempt: env.GITHUB_RUN_ATTEMPT, phase: env.PHASE, checkpointSequence: 0, recipientSha256 };
              const plan = validateSetupPlan(raw, env.SETUP_PLAN_SHA256, expected); requireFoundationPlan(plan);
              let resume;
              if (plan.context.phase === 'setup-complete') {
                const resumeRaw = env.SETUP_RESUME || ''; requireSetupTransportSize(resumeRaw);
                resume = validateSetupResume(resumeRaw, env.SETUP_RESUME_SHA256, plan, plan.prior.artifact);
              }
              const paths = setupRunPaths(env.RUNNER_TEMP, env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT);
              await mkdir(paths.inputs, { mode: 0o700 });
              await writePrivateJson(join(paths.inputs, 'plan.json'), plan);
              if (resume) await writePrivateJson(join(paths.inputs, 'resume.json'), resume);
              await writePrivateJson(join(paths.inputs, 'approval.json'), { planSha256: env.SETUP_PLAN_SHA256, ...(resume ? { resumeSha256: env.SETUP_RESUME_SHA256 } : {}) });
              // The file runner consumes PEM bytes, not a JSON string.
              const { open } = await import('node:fs/promises');
              const file = await open(join(paths.inputs, 'recipient.pem'), 'wx', 0o600);
              try { await file.writeFile(env.RECOVERY_PUBLIC_KEY, 'utf8'); await file.sync(); } finally { await file.close(); }
            } catch { throw new Error('SETUP_PRIVATE_INPUT_REFUSED'); }
      - id: stage-complete
        if: inputs.phase == 'setup-complete'
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          PHASE: ${{ inputs.phase }}
          SETUP_PLAN: ${{ secrets.STAGING_DRAWING_SETUP_PLAN }}
          SETUP_PLAN_SHA256: ${{ secrets.STAGING_DRAWING_SETUP_PLAN_SHA256 }}
          RECOVERY_PUBLIC_KEY: ${{ vars.STAGING_DRAWING_RECOVERY_PUBLIC_KEY }}
          SETUP_RESUME: ${{ secrets.STAGING_DRAWING_SETUP_RESUME }}
          SETUP_RESUME_SHA256: ${{ secrets.STAGING_DRAWING_SETUP_RESUME_SHA256 }}
        with:
          script: *stage-private-inputs
      - id: prepare
        name: Prepare private initial checkpoint (guarded)
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          PHASE: ${{ inputs.phase }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          import { setupRunPaths } from './scripts/drawing-cutover-provision.ts';
          import { readPrivateJson } from './scripts/drawing-cutover-recovery.ts';
          try {
            const env = process.env; const paths = setupRunPaths(env.RUNNER_TEMP, env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT);
            const approval = await readPrivateJson(join(paths.inputs, 'approval.json'));
            const args = ['scripts/drawing-cutover-provision.ts', 'prepare', '--target=staging', '--expected-ref=ndyfjffsulfbwpmwdmic', `--candidate-sha=${env.CANDIDATE_SHA}`, `--phase=${env.PHASE}`, `--plan-sha256=${approval.planSha256}`];
            if (env.PHASE === 'setup-complete') args.push(`--resume-sha256=${approval.resumeSha256}`);
            execFileSync(process.execPath, args, { stdio: 'ignore' });
          } catch { console.error('SETUP_PREPARE_REFUSED'); process.exitCode = 1; }
          NODE
      - id: initial
        uses: actions/upload-artifact@v7
        with:
          name: drawing-foundation-initial-${{ needs.verify.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drawing-foundation-${{ github.run_id }}-${{ github.run_attempt }}/initial.enc.json
          if-no-files-found: error
          retention-days: 1
      - id: bind-initial
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          INITIAL_ARTIFACT_ID: ${{ steps.initial.outputs.artifact-id }}
          INITIAL_ARCHIVE_SHA256: ${{ steps.initial.outputs.artifact-digest }}
        with:
          script: |
            try {
              const { join } = await import('node:path');
              const { setupRunPaths } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/drawing-cutover-provision.ts`);
              const { digest, validateArtifactBinding } = await import(`${process.env.GITHUB_WORKSPACE}/e2e/drawing-cutover-setup.ts`);
              const { readPrivateText, writePrivateJson } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/drawing-cutover-recovery.ts`);
              const env = process.env; const artifactId = env.INITIAL_ARTIFACT_ID; const archiveSha256 = env.INITIAL_ARCHIVE_SHA256;
              if (!/^[1-9][0-9]{0,19}$/.test(artifactId || '') || !/^[a-f0-9]{64}$/.test(archiveSha256 || '') || env.GITHUB_RUN_ATTEMPT !== '1') throw new Error();
              const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: artifactId });
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: env.GITHUB_RUN_ID });
              const workflow = '.github/workflows/drawing-cutover-staging.yml';
              if (!Number.isSafeInteger(artifact.id) || String(artifact.id) !== artifactId || artifact.expired ||
                  artifact.name !== `drawing-foundation-initial-${env.CANDIDATE_SHA}-${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}` ||
                  artifact.digest !== `sha256:${archiveSha256}` || String(artifact.workflow_run?.id) !== env.GITHUB_RUN_ID ||
                  artifact.workflow_run?.head_sha !== context.sha || artifact.workflow_run?.head_branch !== 'main' ||
                  String(run.id) !== env.GITHUB_RUN_ID || String(run.run_attempt) !== env.GITHUB_RUN_ATTEMPT || run.head_sha !== context.sha ||
                  run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.path !== workflow) throw new Error();
              const paths = setupRunPaths(env.RUNNER_TEMP, env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT);
              const ciphertextSha256 = digest(await readPrivateText(join(paths.run, 'initial.enc.json'), 1_402_200));
              const binding = { artifactId, repository: 'lorteezy87/SteelBuild-Pro-Rev.2', workflow, workflowRunId: env.GITHUB_RUN_ID,
                workflowRunAttempt: env.GITHUB_RUN_ATTEMPT, candidateSha: env.CANDIDATE_SHA, archiveSha256, ciphertextSha256 };
              const independent = { ...binding, artifactId: String(artifact.id), archiveSha256: artifact.digest.slice(7) };
              validateArtifactBinding(binding, independent);
              await writePrivateJson(join(paths.inputs, 'initial-upload.json'), { artifact: binding, independentlyVerifiedExpected: independent });
            } catch { throw new Error('SETUP_INITIAL_UPLOAD_REFUSED'); }
      - id: server
        if: success()
        name: Finite server execution only (guarded)
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          PHASE: ${{ inputs.phase }}
          SETUP_KEY: ${{ secrets.STAGING_DRAWING_SETUP_SECRET_KEY }}
          PUBLIC_KEY: ${{ secrets.STAGING_E2E_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          import { setupRunPaths } from './scripts/drawing-cutover-provision.ts';
          import { readPrivateJson, writePrivateJson } from './scripts/drawing-cutover-recovery.ts';
          try {
            const env = process.env; const paths = setupRunPaths(env.RUNNER_TEMP, env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT);
            const approval = await readPrivateJson(join(paths.inputs, 'approval.json'));
            const plan = await readPrivateJson(join(paths.inputs, 'plan.json'));
            await writePrivateJson(join(paths.inputs, 'server-credentials.json'), { publicKey: env.PUBLIC_KEY, setupKey: env.SETUP_KEY, setupKeyIdentifier: plan.keyReview.setupKeyIdentifier });
            const args = ['scripts/drawing-cutover-provision.ts', 'run', '--target=staging', '--expected-ref=ndyfjffsulfbwpmwdmic', `--candidate-sha=${env.CANDIDATE_SHA}`, `--phase=${env.PHASE}`, `--plan-sha256=${approval.planSha256}`];
            if (env.PHASE === 'setup-complete') args.push(`--resume-sha256=${approval.resumeSha256}`);
            execFileSync(process.execPath, args, { stdio: 'ignore' });
          } catch { console.error('SETUP_RUN_INCOMPLETE_OR_UNKNOWN'); process.exitCode = 1; }
          NODE
      - id: final
        name: Retain terminal encrypted recovery or fail incomplete
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: drawing-foundation-final-${{ needs.verify.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drawing-foundation-${{ github.run_id }}-${{ github.run_attempt }}/final.enc.json
          if-no-files-found: error
          retention-days: 1
