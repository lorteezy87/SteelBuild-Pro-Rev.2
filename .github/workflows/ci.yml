# CI — lint + typecheck + test + build on every push and PR.
#
# What runs here:
#   1. Install (cached node_modules via actions/setup-node)
#   2. ESLint (warnings allowed, errors fail the build)
#   3. TypeScript checks for both .ts (tsconfig) and .js/.jsx (jsconfig)
#   4. Vitest unit tests (currently 480 passing)
#   5. Production Vite build (catches dead-imports / runtime-only refs
#      that the lint + typecheck passes don't notice)
#
# What does NOT run here:
#   - End-to-end tests (no E2E suite yet)
#   - Lighthouse / a11y / bundle-size budgets (queued for later)
#   - Deploy — Vercel handles that on push to codex/base44-deploy-nick
#
# This workflow runs against EVERY push and pull request to any branch
# so contributors see green/red feedback before merging into deploy.
# The deploy branch (codex/base44-deploy-nick) gets the same gates plus
# Vercel's own build, so a regression has two chances to be caught.

name: CI

on:
  push:
    branches:
      - main
      - master
      - codex/base44-deploy-nick
      - "claude/**"
  pull_request:
    branches:
      - main
      - master
      - codex/base44-deploy-nick

# Cancel any in-progress runs for the same branch when a new push comes in.
# Avoids piling up redundant CI for rapid iteration on a feature branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # `--quiet` suppresses warnings (we have many that aren't fixed
        # yet); errors still fail the run. Tighten this once we work
        # the existing warnings down.
        run: npm run lint

      - name: Typecheck (TypeScript)
        # Currently non-blocking — src/types/supabase.ts is stale
        # (missing submittal_rounds + a few other recently-added tables).
        # Run `npm run types:db` locally with the Supabase CLI to
        # regenerate, then flip this to a blocking check.
        # See TECH_DEBT.md for the full ticket.
        run: npm run typecheck
        continue-on-error: true

      - name: Typecheck (JavaScript via jsconfig)
        # The codebase is mid-migration to TS; this catches obvious
        # type errors in the .js / .jsx side via // @ts-check + JSDoc.
        run: npm run typecheck:js
        continue-on-error: true

      - name: Run Vitest tests
        run: npm test

      - name: Production build
        # Catches dead imports / runtime-only refs that the type checks
        # don't see. Output is discarded — we just want the failure
        # signal.
        run: npm run build
