# CI — lint + typecheck + test + build on every push and PR.
#
# What runs here:
#   1. Install (cached node_modules via actions/setup-node)
#   2. ESLint (warnings allowed, errors fail the build)
#   3. TypeScript checks for both .ts (tsconfig) and .js/.jsx (jsconfig)
#   4. Vitest unit tests (the full unit suite — `npm test`)
#   5. Production Vite build (catches dead-imports / runtime-only refs
#      that the lint + typecheck passes don't notice)
#
# What does NOT run here:
#   - End-to-end tests (no Playwright/E2E suite committed to this repo yet —
#     `npm run test:e2e` will be wired in as a non-blocking job once it lands)
#   - Lighthouse / a11y / bundle-size budgets (queued for later)
#   - Deploy — Vercel handles that on push to main
#
# This workflow runs against EVERY push and pull request to any branch
# so contributors see green/red feedback before merging into deploy.
# The deploy branch (main) gets the same gates plus
# Vercel's own build, so a regression has two chances to be caught.

name: CI

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
    branches:
      - main
      - master

# Cancel any in-progress runs for the same branch when a new push comes in.
# Avoids piling up redundant CI for rapid iteration on a feature branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CI placeholders for Vite/Vitest. Real values live in Vercel project env
    # for production builds; CI only needs non-empty values so src/lib/supabase.ts
    # passes its import-time guard. No test should hit this URL — anything that
    # touches the network is expected to mock the supabase client.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # `--quiet` suppresses warnings (we have many that aren't fixed
        # yet); errors still fail the run. Tighten this once we work
        # the existing warnings down.
        run: npm run lint

      - name: Typecheck (TypeScript)
        # Blocking: guards Supabase table names, hook contracts,
        # and TS/TSX integration points before Vercel receives a deploy.
        run: npm run typecheck

      - name: Typecheck (JavaScript via jsconfig)
        # Blocking: parses JS/JSX and verifies module resolution while the
        # remaining business logic migrates toward TypeScript coverage.
        run: npm run typecheck:js

      - name: Run Vitest tests
        run: npm test

      - name: Production build
        # Catches dead imports / runtime-only refs that the type checks
        # don't see. Output is discarded — we just want the failure
        # signal.
        #
        # The build script itself raises the V8 heap to 4 GB
        # (node --max-old-space-size=4096 ...vite build) because the large
        # BIM/PDF/three vendor chunks OOM Rollup at Node's default heap. That
        # limit now lives in package.json so it applies everywhere the build
        # runs — CI here, Vercel production (vercel.json runs `npm run build`),
        # and local. This NODE_OPTIONS is kept as a redundant safety net only.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ── Gated production deploy ──────────────────────────────────────────────
  # Deploys to Vercel ONLY after the `ci` job above passes, on a push to main —
  # so a red lint / typecheck / test / build can no longer reach
  # steelbuild-pro.com. Paired with vercel.json `git.deploymentEnabled.main=false`
  # (Vercel's own git auto-deploy is turned off) so this Action is the SOLE
  # production deploy path. `vercel pull` fetches the real production env
  # (VITE_SUPABASE_*) before building, then we ship the prebuilt output.
  deploy:
    name: Deploy to Vercel (production)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project + production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output (production)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
