# CI + gated deploy — lint, typecheck, test, build, then ship.
#
# Jobs (defined below):
#   - ci:        ESLint + TypeScript (src .ts via tsconfig, scripts/ .ts via
#                tsconfig.scripts.json, .js/.jsx via jsconfig) + Vitest unit
#                suite + production Vite build. Runs on EVERY push and pull
#                request to any branch, so contributors get green/red feedback
#                before merge.
#   - deploy-cloudflare: THE production deploy — `wrangler deploy` to the
#                Cloudflare Worker. GATED on `ci` and ONLY on a push to main, so
#                a red lint/typecheck/test/build cannot reach
#                steelbuild-pro.com. That gate only holds while this is the SOLE
#                publisher, so Cloudflare's own Workers Builds git integration
#                (which deploys on push, ungated) must stay disconnected.
#                Opt-in via the CLOUDFLARE_ENABLED repo variable — while it is
#                unset, pushes to main deploy NOWHERE.
#                See docs/runbooks/cloudflare-migration.md.
#   - preview-cloudflare: per-PR preview URL via `wrangler versions upload`,
#                which uploads a version WITHOUT promoting it to the live
#                deployment. Replaces the previews Workers Builds used to post.
#   - e2e-smoke: Playwright smoke AFTER deploy, NON-BLOCKING (it is not in
#                `deploy-cloudflare.needs`, so it can never gate or roll back
#                prod). Opt-in via E2E_ENABLED. See e2e/README.md.
#   - staging-e2e-readonly / staging-e2e-mutations: authenticated Playwright
#                runs against a staging environment, opt-in via STAGING_E2E_*
#                and STAGING_BASE_URL. Their credentials and Supabase target are
#                staging-specific and cannot target prod.
#   - dependency-audit: `npm audit` over production deps, ADVISORY (not in
#                `deploy-cloudflare.needs`, so a newly disclosed CVE alarms the
#                run without blocking the release train).
#
# REMOVED (2026-09): the `deploy` and `deploy-staging` jobs, which shipped to
# Vercel. That account is closed, so both could only ever fail.
#
# `deploy-staging` took the staging ENVIRONMENT with it. The two staging E2E
# jobs survive on `needs: ci`, but they carry the staging-branch/push condition
# in their OWN `if:` — do not remove it. They previously inherited that gate by
# depending on `deploy-staging` (GitHub skips a job whose `needs` were skipped);
# repointing them at `ci` without restating it made them run on every pull
# request, where they failed against a staging environment that no longer
# exists. Beyond the dead Vercel project, the staging SUPABASE project no longer
# resolves either (`getaddrinfo ENOTFOUND`), so staging needs rebuilding from
# scratch — see docs/runbooks/cloudflare-migration.md step 8.
#
#   - secret-scan: gitleaks over the full history. BLOCKING — a committed
#                credential is compromised on push; rotation is the only fix, so
#                there is nothing to weigh and the run should fail.
#
# What does NOT run here:
#   - E2E as a BLOCKING gate (it's the post-deploy, observe-only job above).
#   - SAST — still queued; needs an owner decision on tooling
#     (see ENTERPRISE_READINESS_AUDIT.md L13).
#   - Lighthouse / a11y / bundle-size budgets (queued for later).
#
# NOTE ON ENFORCEMENT: none of these gates bind until branch protection on
# `main` requires them. Until then a direct push deploys ungated and the
# "a red CI cannot reach steelbuild-pro.com" claim above is aspirational.
# See TECH_DEBT.md B41-P1-005.

name: CI

on:
  push:
    branches:
      - main
      - master
      - staging
      - "claude/**"
  pull_request:
    branches:
      - main
      - master
      - staging

# Cancel any in-progress runs for the same branch when a new push comes in.
# Avoids piling up redundant CI for rapid iteration on a feature branch.
concurrency:
  group: ci-${{ github.ref }}
  # Cancel redundant runs on feature branches only — NEVER cancel a main OR
  # staging run: a cancelled green run would skip its deploy and leave that
  # environment stale. (M8, H3)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

# Least-privilege default for the ambient GITHUB_TOKEN (M12/H6). The deploy and
# preview jobs authenticate to Cloudflare with their own CLOUDFLARE_* secrets,
# not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CI placeholders for Vite/Vitest. Real values come from the
    # VITE_SUPABASE_* repo secrets in the deploy/preview jobs; CI only needs
    # non-empty values so src/lib/supabase.ts passes its import-time guard. No
    # test should hit this URL — anything that touches the network is expected
    # to mock the supabase client. Those jobs REFUSE to build if they ever see
    # these placeholder values, so this cannot leak into a deploy.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # `--quiet` suppresses warnings (we have many that aren't fixed
        # yet); errors still fail the run. Tighten this once we work
        # the existing warnings down.
        run: npm run lint

      - name: No new JavaScript under src/
        # Phase 1 of docs/architecture/typescript-standard.md — blocks new
        # .js/.jsx additions vs origin/main (existing JS may remain until
        # intentionally converted with real types).
        run: npm run check:no-new-js

      - name: Typecheck (TypeScript)
        # Blocking: guards Supabase table names, hook contracts,
        # and TS/TSX integration points before anything is published.
        # Also compiles scripts/**/*.ts under tsconfig.scripts.json (strict,
        # nodenext); tsconfig.json itself only includes src/.
        run: npm run typecheck

      - name: Typecheck (JavaScript via jsconfig)
        # Blocking: parses JS/JSX and verifies module resolution while the
        # remaining business logic migrates toward TypeScript coverage.
        run: npm run typecheck:js

      - name: Typecheck (strictNullChecks ratchet)
        # Blocking: enforces strictNullChecks on every .ts/.tsx EXCEPT the
        # grandfathered files listed in scripts/strict-typecheck.mjs. New code
        # and all already-clean files are strict-null by default; a new null
        # error fails CI unless the file is explicitly added to the ignore list.
        # Shrink that list as the two remaining schedule/gantt pages are cleaned.
        # See docs/superpowers/specs/2026-06-22-strictnullchecks-ratchet-design.md
        run: npm run typecheck:strict

      - name: Typecheck (noImplicitAny ratchet)
        # Blocking: enforces noImplicitAny on every .ts/.tsx EXCEPT the
        # grandfathered files in scripts/noimplicitany-typecheck.mjs. New code
        # and all already-clean files may not introduce an untyped `any`. Shrink
        # that list as the 13 heavy schedule/gantt/procurement/etc. pages are
        # cleaned. Shares the filter with the strict-null gate (scripts/lib/).
        run: npm run typecheck:noimplicitany

      - name: Run Vitest tests
        # Deliberately not UTC. vite.config.js pins every test worker to UTC;
        # the runner is already UTC, which would hide a broken pin. From UTC+14
        # src/__tests__/testRunnerTimezone.test.ts fails here if the pin stops
        # reaching Date/Intl, instead of only on a non-UTC dev box.
        env:
          TZ: Pacific/Kiritimati
        run: npm test

      - name: Install Chromium for foundation acceptance
        run: npx playwright install --with-deps chromium

      - name: Verify shell recovery (desktop and mobile, no backend)
        run: npm run test:e2e:foundation

      - name: Verify database helper search paths
        run: |
          npm ci --prefix supabase/tests/function-search-path --ignore-scripts
          npm test --prefix supabase/tests/function-search-path

      - name: Production build
        # Catches dead imports / runtime-only refs that the type checks
        # don't see. Output is discarded — we just want the failure
        # signal.
        #
        # The build script itself raises the V8 heap to 4 GB
        # (node --max-old-space-size=4096 ...vite build) because the large
        # BIM/PDF/three vendor chunks OOM Rollup at Node's default heap. That
        # limit now lives in package.json so it applies everywhere the build
        # runs — CI here, the Cloudflare deploy/preview jobs, and local. This
        # NODE_OPTIONS is kept as a redundant safety net only.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ── Dependency audit ────────────────────────────────────────────────────
  # `npm audit` over PRODUCTION dependencies, via scripts/audit-gate.mjs.
  # Deliberately NOT in `deploy.needs`: a CVE disclosed overnight in a
  # transitive dep should alarm the run (red job, red run), but must not stop
  # an unrelated fix from shipping. Works straight off the lockfile — no
  # `npm ci` needed. (Audit L13, dependency-audit slice; gitleaks/SAST queued.)
  #
  # This job used to run `npm audit --omit=dev --audit-level=high` and exit 0
  # while three real production advisories sat one step below the bar at
  # moderate — green precisely because the issues that mattered were the wrong
  # severity. Lowering the threshold alone would have replaced a silent gate
  # with a permanently red one (react-router's two moderates have no patched
  # 6.x), which is the same thing: a job nobody reads.
  #
  # audit-gate.mjs fails on any moderate+ production advisory that is not named
  # in its ALLOWLIST, with a reason and a review date, and fails again when a
  # waiver goes stale. Exceptions live in the diff instead of under a threshold.
  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit production dependencies (moderate+, waivers reviewed in-repo)
        run: node scripts/audit-gate.mjs

      - name: Audit all dependencies (high+, including build and native tooling)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  # ── Secret scanning (enforced) ──────────────────────────────────────────────
  # Closes the "no secret scanning" gap this file used to list under "What does
  # NOT run here". This repo currently holds no hardcoded credentials — the job
  # exists to keep it that way, because a leaked SUPABASE_SERVICE_ROLE_KEY,
  # STRIPE_SECRET_KEY or EMAIL_WEBHOOK_SECRET bypasses RLS, billing auth, or the
  # inbound-mail gate outright. Those live in Supabase Edge Function secrets and
  # the Cloudflare project env; none of them should ever appear in a diff.
  #
  # BLOCKING, unlike dependency-audit. A CVE in a transitive dep is a risk to
  # weigh; a committed credential is already compromised the moment it is pushed,
  # and the remediation is rotation, not a merge decision. Failing the run is the
  # only useful response.
  #
  # fetch-depth: 0 so gitleaks scans history, not just the tip commit — a secret
  # added and "removed" in a later commit is still in the objects and still live.
  # On a pull_request it diffs the PR range; elsewhere it scans the full history,
  # so expect the first run to take longer.
  #
  # False positive? Do NOT delete the job or add a blanket allowlist. Add a
  # narrowly scoped rule to .gitleaks.toml with a comment naming the file and why
  # the match is benign.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Supabase migration + edge-function drift (enforced) ──────────────────
  # H4/H5: compares production with the reviewed shared-project ownership
  # manifest plus active Rev.2 assets. Unknown/unresolved assets, missing
  # required assets, and deployed deprecated/staging-only functions fail closed.
  # Inventory green does not prove SQL or deployed-source equivalence.
  supabase-drift:
    name: Supabase drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.repository == 'lorteezy87/SteelBuild-Pro-Rev.2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check migration + edge-function drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty."
            echo "Configure the secret to keep production drift checks enforced."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF is empty."
            echo "Configure the repository variable to keep production drift checks enforced."
            exit 1
          fi
          npm run supabase:drift

  # ── Gated PRODUCTION deploy → Cloudflare Workers ─────────────────────────
  # THE production deploy path. The Vercel `deploy` / `deploy-staging` jobs
  # that used to live here are gone: that account is closed, so those jobs
  # could only ever fail.
  #
  # Gated on `ci`, so a red lint / typecheck / test / build cannot reach
  # steelbuild-pro.com. That gate is only real if this stays the SOLE
  # publisher — Cloudflare's own Workers Builds git integration deploys on
  # push with no gate at all, so it must be disconnected in the dashboard.
  # See step 2 of docs/runbooks/cloudflare-migration.md.
  #
  # INERT until you opt in: runs only when the `CLOUDFLARE_ENABLED` repo
  # VARIABLE is "true" (a variable, not a secret — `secrets.*` is unreliable in
  # a job-level `if`, same pattern as e2e-smoke). NOTE the consequence: while
  # it is unset, pushing to main deploys NOWHERE. That is deliberate — better
  # than half-deploying before the secrets below exist — but it does mean the
  # variable is what turns production deploys back on.
  #
  # There is no `vercel pull` equivalent to fetch build-time env, so the VITE_*
  # values come from repo secrets. They are browser-safe by design (the
  # Supabase URL + publishable anon key ship in the bundle; see src/lib/env.ts)
  # — no service key is ever a VITE_* var.
  #
  # Setup + cutover steps: docs/runbooks/cloudflare-migration.md
  deploy-cloudflare:
    name: Deploy to Cloudflare Workers (production)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize production deploys and never cancel one mid-flight — an
    # interrupted deploy wastes minutes and can leave a half-published Worker.
    concurrency:
      group: cloudflare-production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify deploy configuration
        # FAIL CLOSED. The `ci` job builds with deliberate placeholder Supabase
        # values; if those ever leaked into this job's env the build would
        # succeed and publish an app that cannot reach the database — a green
        # deploy of a dead site. Refuse to build instead.
        run: |
          set -e
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets are not set"
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            *ci-placeholder*)
              echo "::error::VITE_SUPABASE_URL is the CI placeholder — refusing to deploy"
              exit 1
              ;;
          esac
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build (production)
        # Plain `npm run build`. Response headers and SPA routing are NOT part
        # of the bundle — they come from public/_headers (which Vite copies
        # verbatim into dist/) and wrangler.jsonc. deployHeaders.test.ts is the
        # only thing asserting those headers still exist, so it runs in `ci`
        # above before anything reaches here.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Stamp the commit as the Sentry release so instrument.js and the
          # vite plugin share one release name, and upload source maps when the
          # token is set (the plugin no-ops if SENTRY_AUTH_TOKEN is empty).
          VITE_APP_VERSION: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Confirm _headers reached the build output
        # public/_headers is a plain file Vite copies verbatim. If it ever stops
        # landing in dist/, the deploy silently loses every security header and
        # the immutable asset caching — exactly the kind of failure nobody
        # notices for months. Check it before publishing, not after.
        run: |
          set -e
          test -f dist/_headers || { echo "::error::dist/_headers missing — headers would be dropped"; exit 1; }
          test -f dist/wasm/web-ifc.wasm || { echo "::error::dist/wasm/web-ifc.wasm missing — IFC viewer would render nothing"; exit 1; }

      - name: Deploy to Cloudflare Workers
        # Uses the pinned wrangler from devDependencies (not @latest) so the
        # deploy tool version is reviewed like any other dependency bump.
        run: npx wrangler deploy

      - name: Post-deploy health check
        # Only runs once CLOUDFLARE_BASE_URL is configured; until then the job
        # stays green while DNS/custom-domain setup is still in progress
        # (mirrors deploy-staging). Point it at the workers.dev URL first, then
        # at the custom domain after cutover.
        if: ${{ vars.CLOUDFLARE_BASE_URL != '' }}
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "${{ vars.CLOUDFLARE_BASE_URL }}")
            if [ "$code" = "200" ]; then echo "cloudflare healthy ($code)"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "::error::Cloudflare health check failed after deploy"; exit 1

  # ── PR preview → Cloudflare version preview URL ──────────────────────────
  # Gives back the per-PR preview URLs that Cloudflare's Workers Builds git
  # integration used to post. Workers Builds is disconnected (it publishes on
  # push with NO `ci` gate — see the production job above); this job restores
  # the preview without restoring the un-gated publish.
  #
  # `wrangler versions upload` uploads a new Worker VERSION and prints a
  # preview URL for it WITHOUT promoting it to the live deployment, so a PR
  # preview can never become production. Only `wrangler deploy` promotes.
  #
  # The preview builds against the SAME Supabase project as production (there
  # is one), so treat a preview URL as a real client: RLS and auth are what
  # protect the data, exactly as on the live site. Preview URLs are public —
  # public/_headers marks them noindex, and Cloudflare Access is the real fix.
  preview-cloudflare:
    name: Cloudflare preview (PR)
    needs: ci
    # Same-repo PRs only. Secrets are not exposed to forked-PR workflows, so a
    # fork would trip the config check below instead of building something
    # broken; skipping outright is clearer.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One preview per PR; a new push supersedes the old upload.
    concurrency:
      group: cloudflare-preview-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify deploy configuration
        # Same fail-closed check as the production job: never build a preview
        # against the CI placeholder Supabase values, or reviewers sign off on
        # an app that cannot reach the database.
        run: |
          set -e
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets are not set"
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            *ci-placeholder*)
              echo "::error::VITE_SUPABASE_URL is the CI placeholder — refusing to build a preview"
              exit 1
              ;;
          esac
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}
          # No SENTRY_AUTH_TOKEN: previews must not upload source maps or claim
          # a Sentry release. Only the production deploy does that.

      - name: Confirm _headers reached the build output
        run: |
          set -e
          test -f dist/_headers || { echo "::error::dist/_headers missing — headers would be dropped"; exit 1; }
          test -f dist/wasm/web-ifc.wasm || { echo "::error::dist/wasm/web-ifc.wasm missing — IFC viewer would render nothing"; exit 1; }

      - name: Upload preview version
        # Uses the pinned wrangler from devDependencies, not @latest, so the
        # deploy tool version is reviewed like any other dependency bump.
        run: npx wrangler versions upload

  # ── Authenticated STAGING smoke (read-only, post-deploy) ─────────────────
  # Runs only the browser navigation specs; no mutation-aware spec is selected.
  # This job starts after deploy-staging completes, so it cannot block or cancel
  # the deployment. Environment guardrails additionally reject the production
  # hostname or a Supabase URL that is not the documented staging project.
  staging-e2e-readonly:
    name: E2E smoke (staging, read-only)
    needs: ci
    # The branch/event condition is LOAD-BEARING, not decoration. This job used
    # to be `needs: deploy-staging`, and that job carried
    # `github.ref == refs/heads/staging && github.event_name == push`; because
    # GitHub skips a job whose `needs` were skipped, this one never ran on a
    # pull request. When deploy-staging was deleted with the Vercel account,
    # moving to `needs: ci` silently dropped that gate and this started running
    # on every PR — against a staging environment that no longer exists
    # (`getaddrinfo ENOTFOUND` on the staging Supabase project). Keep the
    # condition explicit here so the gate does not depend on another job.
    if: >-
      github.ref == 'refs/heads/staging' &&
      github.event_name == 'push' &&
      vars.STAGING_E2E_ENABLED == 'true' &&
      vars.STAGING_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run authenticated read-only staging smoke
        run: npm run test:e2e:staging:readonly
        env:
          E2E_TARGET: staging
          E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          E2E_EXPECTED_SUPABASE_REF: abbeavtbifuddtrifvae
          E2E_USER: ${{ secrets.STAGING_E2E_USER }}
          E2E_PASS: ${{ secrets.STAGING_E2E_PASS }}
          E2E_SUPABASE_URL: ${{ secrets.STAGING_E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.STAGING_E2E_SUPABASE_ANON_KEY }}

      - name: Upload staging Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: staging-playwright-readonly-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Mutation specs are a separate job and require three independent opt-ins:
  # the job variable, E2E_MUTATIONS_ENABLED, and the disposable fixture marker.
  # They are staging-only and are never selected by staging-e2e-readonly.
  staging-e2e-mutations:
    name: E2E gates (staging, disposable mutations)
    needs: ci
    # Same load-bearing branch/event gate as staging-e2e-readonly above — see
    # the comment there for why dropping it broke pull requests.
    if: >-
      github.ref == 'refs/heads/staging' &&
      github.event_name == 'push' &&
      vars.STAGING_E2E_MUTATIONS_ENABLED == 'true' &&
      vars.STAGING_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run staging mutation gates against disposable fixtures
        run: npm run test:e2e:staging:mutations
        env:
          E2E_TARGET: staging
          E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          E2E_EXPECTED_SUPABASE_REF: abbeavtbifuddtrifvae
          E2E_MUTATIONS_ENABLED: "true"
          E2E_MUTATION_FIXTURE_KIND: disposable
          E2E_USER: ${{ secrets.STAGING_E2E_USER }}
          E2E_PASS: ${{ secrets.STAGING_E2E_PASS }}
          E2E_SUPABASE_URL: ${{ secrets.STAGING_E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.STAGING_E2E_SUPABASE_ANON_KEY }}
          E2E_VIEWER_USER: ${{ secrets.STAGING_E2E_VIEWER_USER }}
          E2E_VIEWER_PASS: ${{ secrets.STAGING_E2E_VIEWER_PASS }}
          E2E_FAB_PROJECT_ID: ${{ secrets.STAGING_E2E_FAB_PROJECT_ID }}
          E2E_BLOCKED_DRAWING_ID: ${{ secrets.STAGING_E2E_BLOCKED_DRAWING_ID }}
          E2E_CLEAN_DRAWING_ID: ${{ secrets.STAGING_E2E_CLEAN_DRAWING_ID }}
          E2E_PIECE_PROJECT_ID: ${{ secrets.STAGING_E2E_PIECE_PROJECT_ID }}
          E2E_PIECE_OTHER_TENANT_PROJECT_ID: ${{ secrets.STAGING_E2E_PIECE_OTHER_TENANT_PROJECT_ID }}
          E2E_PIECE_FULL_WORKFLOW: ${{ vars.STAGING_E2E_PIECE_FULL_WORKFLOW }}
          E2E_PIECE_WORK_PACKAGE_ID: ${{ secrets.STAGING_E2E_PIECE_WORK_PACKAGE_ID }}
          E2E_PIECE_APPROVED_DRAWING_ID: ${{ secrets.STAGING_E2E_PIECE_APPROVED_DRAWING_ID }}
          E2E_PIECE_EXCEPTION_WORK_PACKAGE_ID: ${{ secrets.STAGING_E2E_PIECE_EXCEPTION_WORK_PACKAGE_ID }}

      - name: Upload staging mutation Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: staging-playwright-mutation-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── E2E smoke (post-deploy, NON-BLOCKING) ────────────────────────────────
  # The "unit tests pass != it works" layer: signs in with a real session and
  # asserts the daily-driver workflow (drawings -> submittals -> RFIs) plus the
  # server-arbitrated fab-release gate against the JUST-DEPLOYED app.
  #
  # Deploy-safety: this runs AFTER `deploy`, and `deploy` does NOT list it in
  # `needs`, so a flaky or failing E2E run can NEVER block or roll back a
  # production deploy. It is observe-only.
  #
  # Opt-in: only runs when the `E2E_ENABLED` repo VARIABLE is "true" (a variable,
  # not a secret — `secrets.*` is unreliable in a job-level `if`). Until you set
  # it, this job is skipped (never red). Set it once the dedicated test account +
  # secrets exist (see e2e/README.md). Each spec ALSO self-skips when its own
  # fixture env is unset, so you can enable the read-only smoke first and add the
  # mutation-aware fab-release gate later by setting the E2E_FAB_* secrets — the
  # gate spec WRITES to fab_release_log, so point it at a TEST org only.
  e2e-smoke:
    name: E2E smoke (post-deploy, non-blocking)
    needs: deploy-cloudflare
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://steelbuild-pro.com
          # Sign-in: global-setup (browser session) + the API fixtures. The
          # passwords are secrets; the anon key is browser-public but stored as a
          # secret for one consistent place.
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          # Optional viewer account -> enables the fab-gate RLS-deny assertion.
          E2E_VIEWER_USER: ${{ secrets.E2E_VIEWER_USER }}
          E2E_VIEWER_PASS: ${{ secrets.E2E_VIEWER_PASS }}
          # Fab-release gate fixture (TEST org ONLY — the spec WRITES one append-
          # only row per run). Leave unset to skip that spec and run only the
          # read-only smoke. Verify the two drawing ids with the gate's own fn:
          #   select * from fab_release_blocking_rfis(array['<uuid>']::uuid[]);
          E2E_FAB_PROJECT_ID: ${{ secrets.E2E_FAB_PROJECT_ID }}
          E2E_BLOCKED_DRAWING_ID: ${{ secrets.E2E_BLOCKED_DRAWING_ID }}
          E2E_CLEAN_DRAWING_ID: ${{ secrets.E2E_CLEAN_DRAWING_ID }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
