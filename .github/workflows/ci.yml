# CI + gated deploy — lint, typecheck, test, build, then ship.
#
# Jobs (defined below):
#   - ci:        ESLint + TypeScript (.ts via tsconfig, .js/.jsx via jsconfig)
#                + Vitest unit suite + production Vite build. Runs on EVERY push
#                and pull request to any branch, so contributors get green/red
#                feedback before merge.
#   - deploy:    production deploy to Vercel via the Vercel CLI (prebuilt output).
#                GATED on `ci` and ONLY on a push to main. This GitHub Action is
#                the SOLE production deploy path: Vercel's own git auto-deploy is
#                turned OFF (vercel.json `git.deploymentEnabled.main=false`), so a
#                red lint/typecheck/test/build can no longer reach
#                steelbuild-pro.com — only a green push to main deploys.
#   - e2e-smoke: Playwright smoke AFTER deploy, NON-BLOCKING (it is not in
#                `deploy.needs`, so it can never gate or roll back prod). Opt-in
#                via the E2E_ENABLED repo variable. See e2e/README.md.
#
# What does NOT run here:
#   - E2E as a BLOCKING gate (it's the post-deploy, observe-only job above).
#   - Lighthouse / a11y / bundle-size budgets (queued for later).

name: CI

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
    branches:
      - main
      - master

# Cancel any in-progress runs for the same branch when a new push comes in.
# Avoids piling up redundant CI for rapid iteration on a feature branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CI placeholders for Vite/Vitest. Real values live in Vercel project env
    # for production builds; CI only needs non-empty values so src/lib/supabase.ts
    # passes its import-time guard. No test should hit this URL — anything that
    # touches the network is expected to mock the supabase client.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # `--quiet` suppresses warnings (we have many that aren't fixed
        # yet); errors still fail the run. Tighten this once we work
        # the existing warnings down.
        run: npm run lint

      - name: Typecheck (TypeScript)
        # Blocking: guards Supabase table names, hook contracts,
        # and TS/TSX integration points before Vercel receives a deploy.
        run: npm run typecheck

      - name: Typecheck (JavaScript via jsconfig)
        # Blocking: parses JS/JSX and verifies module resolution while the
        # remaining business logic migrates toward TypeScript coverage.
        run: npm run typecheck:js

      - name: Typecheck (strictNullChecks ratchet)
        # Blocking: enforces strictNullChecks on every .ts/.tsx EXCEPT the
        # grandfathered files listed in scripts/strict-typecheck.mjs. New code
        # and all already-clean files are strict-null by default; a new null
        # error fails CI unless the file is explicitly added to the ignore list.
        # Shrink that list as the two remaining schedule/gantt pages are cleaned.
        # See docs/superpowers/specs/2026-06-22-strictnullchecks-ratchet-design.md
        run: npm run typecheck:strict

      - name: Run Vitest tests
        run: npm test

      - name: Production build
        # Catches dead imports / runtime-only refs that the type checks
        # don't see. Output is discarded — we just want the failure
        # signal.
        #
        # The build script itself raises the V8 heap to 4 GB
        # (node --max-old-space-size=4096 ...vite build) because the large
        # BIM/PDF/three vendor chunks OOM Rollup at Node's default heap. That
        # limit now lives in package.json so it applies everywhere the build
        # runs — CI here, Vercel production (vercel.json runs `npm run build`),
        # and local. This NODE_OPTIONS is kept as a redundant safety net only.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ── Gated production deploy ──────────────────────────────────────────────
  # Deploys to Vercel ONLY after the `ci` job above passes, on a push to main —
  # so a red lint / typecheck / test / build can no longer reach
  # steelbuild-pro.com. Paired with vercel.json `git.deploymentEnabled.main=false`
  # (Vercel's own git auto-deploy is turned off) so this Action is the SOLE
  # production deploy path. `vercel pull` fetches the real production env
  # (VITE_SUPABASE_*) before building, then we ship the prebuilt output.
  deploy:
    name: Deploy to Vercel (production)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project + production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output (production)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ── E2E smoke (post-deploy, NON-BLOCKING) ────────────────────────────────
  # The "unit tests pass != it works" layer: signs in with a real session and
  # asserts the daily-driver workflow (drawings -> submittals -> RFIs) plus the
  # server-arbitrated fab-release gate against the JUST-DEPLOYED app.
  #
  # Deploy-safety: this runs AFTER `deploy`, and `deploy` does NOT list it in
  # `needs`, so a flaky or failing E2E run can NEVER block or roll back a
  # production deploy. It is observe-only.
  #
  # Opt-in: only runs when the `E2E_ENABLED` repo VARIABLE is "true" (a variable,
  # not a secret — `secrets.*` is unreliable in a job-level `if`). Until you set
  # it, this job is skipped (never red). Set it once the dedicated test account +
  # secrets exist (see e2e/README.md). Each spec ALSO self-skips when its own
  # fixture env is unset, so you can enable the read-only smoke first and add the
  # mutation-aware fab-release gate later by setting the E2E_FAB_* secrets — the
  # gate spec WRITES to fab_release_log, so point it at a TEST org only.
  e2e-smoke:
    name: E2E smoke (post-deploy, non-blocking)
    needs: deploy
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://steelbuild-pro.com
          # Sign-in: global-setup (browser session) + the API fixtures. The
          # passwords are secrets; the anon key is browser-public but stored as a
          # secret for one consistent place.
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          # Optional viewer account -> enables the fab-gate RLS-deny assertion.
          E2E_VIEWER_USER: ${{ secrets.E2E_VIEWER_USER }}
          E2E_VIEWER_PASS: ${{ secrets.E2E_VIEWER_PASS }}
          # Fab-release gate fixture (TEST org ONLY — the spec WRITES one append-
          # only row per run). Leave unset to skip that spec and run only the
          # read-only smoke. Verify the two drawing ids with the gate's own fn:
          #   select * from fab_release_blocking_rfis(array['<uuid>']::uuid[]);
          E2E_FAB_PROJECT_ID: ${{ secrets.E2E_FAB_PROJECT_ID }}
          E2E_BLOCKED_DRAWING_ID: ${{ secrets.E2E_BLOCKED_DRAWING_ID }}
          E2E_CLEAN_DRAWING_ID: ${{ secrets.E2E_CLEAN_DRAWING_ID }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
