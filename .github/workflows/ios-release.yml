name: iOS App Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 1.0.0)
        required: true
        type: string
      build_number:
        description: Unused, increasing App Store build number
        required: true
        type: string
      upload:
        description: Upload to App Store Connect after archiving
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  release-gates:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require green production checks on the exact main commit
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { assertIosReleaseChecks } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ios-release-gate.mjs`);
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.commit.sha !== context.sha) throw new Error('Main changed. Start a new release from current main.');
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha, event: 'push', per_page: 100
            });
            const run = data.workflow_runs[0];
            if (!run) throw new Error('No CI run exists for this commit.');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, filter: 'latest', per_page: 100
            });
            assertIosReleaseChecks(run, jobs, context.sha);

  archive:
    needs: release-gates
    runs-on: macos-latest
    timeout-minutes: 45
    environment: app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Archive, validate, and optionally upload
        run: bash scripts/ios-release.sh
        env:
          IOS_VERSION: ${{ inputs.version }}
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_UPLOAD: ${{ inputs.upload }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-release-${{ inputs.build_number }}
          path: |
            ios/App/output/release-evidence.json
            ios/App/output/app-store-receipt.json
            ios/App/output/*.ipa
            ios/App/output/xcode-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30
