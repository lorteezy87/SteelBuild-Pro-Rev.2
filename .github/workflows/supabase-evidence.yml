name: Supabase production evidence

on:
  push:
    branches:
      - copilot/security-audit-phase-1
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CAPTURE_READ_ONLY_EVIDENCE to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-evidence
  cancel-in-progress: false

jobs:
  capture:
    name: Capture read-only production evidence
    if: github.repository == 'lorteezy87/SteelBuild-Pro-Rev.2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Capture migration, schema, and function evidence
        env:
          CONFIRMATION: ${{ github.event_name == 'push' && 'CAPTURE_READ_ONLY_EVIDENCE' || inputs.confirmation }}
          EXPECTED_PROJECT_REF: kjrwqagyeswwoxpjkcko
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          umask 077

          [ "$CONFIRMATION" = "CAPTURE_READ_ONLY_EVIDENCE" ] || {
            echo "Exact read-only confirmation phrase is required."
            exit 1
          }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || {
            echo "SUPABASE_ACCESS_TOKEN is empty."
            exit 1
          }
          [ -n "$SUPABASE_DB_PASSWORD" ] || {
            echo "SUPABASE_DB_PASSWORD is empty."
            exit 1
          }
          [ "$SUPABASE_PROJECT_REF" = "$EXPECTED_PROJECT_REF" ] || {
            echo "SUPABASE_PROJECT_REF does not match the approved production project."
            exit 1
          }

          evidence_dir="$RUNNER_TEMP/supabase-production-evidence"
          capture_work="$RUNNER_TEMP/supabase-function-capture"
          mkdir -p "$evidence_dir"/{backups,ledger,schema,functions} "$capture_work"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/backups" \
            | jq '.' \
            > "$evidence_dir/backups/inventory.json"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/migrations" \
            | jq 'map({version, name, statements})' \
            > "$evidence_dir/ledger/migrations.json"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions" \
            | jq 'map({
                id, slug, name, status, version, verify_jwt, created_at, updated_at,
                import_map, import_map_path, entrypoint_path
              })' \
            > "$evidence_dir/functions/inventory.json"

          supabase migration list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            > "$evidence_dir/ledger/migration-list.txt"

          supabase db dump \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --schema public \
            --file "$evidence_dir/schema/public.sql"

          cat > "$evidence_dir/schema/read-only-probes.sql" <<'SQL'
          WITH function_catalog AS (
            SELECT
              p.oid::regprocedure::text AS identity,
              encode(sha256(convert_to(p.prosrc, 'UTF8')), 'hex') AS body_sha256,
              p.prosecdef AS security_definer,
              p.provolatile AS volatility,
              p.proconfig AS configuration,
              p.proacl::text AS acl
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
          ),
          table_catalog AS (
            SELECT
              c.relname AS table_name,
              c.relrowsecurity AS rls_enabled,
              c.relforcerowsecurity AS rls_forced,
              c.relacl::text AS acl
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p')
          ),
          column_catalog AS (
            SELECT
              table_name,
              column_name,
              data_type,
              udt_name,
              is_nullable,
              column_default
            FROM information_schema.columns
            WHERE table_schema = 'public'
          ),
          constraint_catalog AS (
            SELECT
              c.relname AS table_name,
              con.conname AS constraint_name,
              con.contype AS constraint_type,
              pg_get_constraintdef(con.oid, true) AS definition
            FROM pg_constraint con
            JOIN pg_class c ON c.oid = con.conrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
          ),
          policy_catalog AS (
            SELECT
              tablename,
              policyname,
              permissive,
              roles,
              cmd,
              qual,
              with_check
            FROM pg_policies
            WHERE schemaname = 'public'
          ),
          index_catalog AS (
            SELECT tablename, indexname, indexdef
            FROM pg_indexes
            WHERE schemaname = 'public'
          ),
          trigger_catalog AS (
            SELECT
              c.relname AS table_name,
              t.tgname AS trigger_name,
              pg_get_triggerdef(t.oid, true) AS definition
            FROM pg_trigger t
            JOIN pg_class c ON c.oid = t.tgrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND NOT t.tgisinternal
          ),
          valid_schedule_dependencies AS (
            SELECT
              id,
              CASE
                WHEN dependencies IS NULL THEN '[]'::jsonb
                WHEN NOT pg_input_is_valid(dependencies, 'jsonb') THEN '[]'::jsonb
                WHEN jsonb_typeof(dependencies::jsonb) <> 'array' THEN '[]'::jsonb
                ELSE dependencies::jsonb
              END AS dependencies
            FROM public.schedule_tasks
          ),
          schedule_dependency_elements AS (
            SELECT
              t.id,
              CASE jsonb_typeof(e.elem)
                WHEN 'object' THEN e.elem ->> 'id'
                WHEN 'string' THEN e.elem #>> '{}'
                ELSE NULL
              END AS predecessor_id
            FROM valid_schedule_dependencies t
            CROSS JOIN LATERAL jsonb_array_elements(t.dependencies) AS e(elem)
          ),
          invariant_catalog AS (
            SELECT 'bimc_rfi_date_repair' AS check_name,
              jsonb_build_object(
                'target_rows', count(*),
                'expected_rows', count(*) FILTER (
                  WHERE submitted_date = date '2026-08-04'
                )
              ) AS result
            FROM public.rfis
            WHERE id IN (
              'a2ddeaba-b43f-4b62-a210-49f760e93e7d'::uuid,
              'fa636c90-16e7-4449-8473-72e91f5b4431'::uuid
            )
            UNION ALL
            SELECT 'bimc_schedule_finish_unknown',
              jsonb_build_object(
                'target_rows', count(*),
                'expected_rows', count(*) FILTER (WHERE end_date IS NULL)
              )
            FROM public.schedule_tasks
            WHERE id = 'd833ffde-3d38-40e0-a154-3d914aaa3645'::uuid
            UNION ALL
            SELECT 'production_notes_date_noted_backfill',
              jsonb_build_object(
                'remaining_rows', count(*) FILTER (
                  WHERE date_noted IS NULL AND note_date IS NOT NULL
                )
              )
            FROM public.production_notes
            UNION ALL
            SELECT 'schedule_duration_consistency',
              jsonb_build_object(
                'dated_mismatches', count(*) FILTER (
                  WHERE start_date IS NOT NULL
                    AND end_date IS NOT NULL
                    AND end_date >= start_date
                    AND duration IS DISTINCT FROM (end_date - start_date) + 1
                ),
                'inverted_nonnull', count(*) FILTER (
                  WHERE start_date IS NOT NULL
                    AND end_date IS NOT NULL
                    AND end_date < start_date
                    AND duration IS NOT NULL
                )
              )
            FROM public.schedule_tasks
            UNION ALL
            SELECT 'schedule_predecessor_orphans',
              jsonb_build_object('remaining_links', count(*))
            FROM schedule_dependency_elements d
            WHERE d.predecessor_id IS NULL
              OR NOT EXISTS (
                SELECT 1
                FROM public.schedule_tasks predecessor
                WHERE predecessor.id::text = d.predecessor_id
              )
            UNION ALL
            SELECT 'archived_piece_projection_links',
              jsonb_build_object('remaining_links', count(*))
            FROM public.model_elements me
            JOIN public.pieces p ON p.id = me.piece_id
            WHERE me.is_deleted = false
              AND (coalesce(p.is_deleted, false) = true OR p.deleted_at IS NOT NULL)
          )
          SELECT jsonb_build_object(
            'functions', (
              SELECT coalesce(jsonb_agg(to_jsonb(f) ORDER BY f.identity), '[]')
              FROM function_catalog f
            ),
            'tables', (
              SELECT coalesce(jsonb_agg(to_jsonb(t) ORDER BY t.table_name), '[]')
              FROM table_catalog t
            ),
            'columns', (
              SELECT coalesce(
                jsonb_agg(to_jsonb(c) ORDER BY c.table_name, c.column_name),
                '[]'
              )
              FROM column_catalog c
            ),
            'constraints', (
              SELECT coalesce(
                jsonb_agg(to_jsonb(c) ORDER BY c.table_name, c.constraint_name),
                '[]'
              )
              FROM constraint_catalog c
            ),
            'policies', (
              SELECT coalesce(
                jsonb_agg(to_jsonb(p) ORDER BY p.tablename, p.policyname),
                '[]'
              )
              FROM policy_catalog p
            ),
            'indexes', (
              SELECT coalesce(
                jsonb_agg(to_jsonb(i) ORDER BY i.tablename, i.indexname),
                '[]'
              )
              FROM index_catalog i
            ),
            'triggers', (
              SELECT coalesce(
                jsonb_agg(to_jsonb(t) ORDER BY t.table_name, t.trigger_name),
                '[]'
              )
              FROM trigger_catalog t
            ),
            'invariants', (
              SELECT coalesce(
                jsonb_agg(to_jsonb(i) ORDER BY i.check_name),
                '[]'
              )
              FROM invariant_catalog i
            )
          ) AS evidence;
          SQL

          jq -n \
            --rawfile query "$evidence_dir/schema/read-only-probes.sql" \
            '{query: $query, read_only: true}' \
            > "$RUNNER_TEMP/read-only-probe-request.json"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/read-only-probe-request.json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            | jq '.' \
            > "$evidence_dir/schema/read-only-probes.json"
          rm "$RUNNER_TEMP/read-only-probe-request.json"

          (
            cd "$capture_work"
            mkdir -p supabase/functions "$evidence_dir/functions/raw"
            : > "$evidence_dir/functions/body-capture-failures.txt"
            : > "$evidence_dir/functions/source-extraction-failures.txt"
            jq -r '.[].slug' "$evidence_dir/functions/inventory.json" \
              | while IFS= read -r slug; do
                  if ! supabase functions download "$slug" \
                    --project-ref "$SUPABASE_PROJECT_REF" \
                    --use-api \
                    --yes \
                    >> "$evidence_dir/functions/download.log" 2>&1; then
                    printf '%s\n' "$slug" \
                      >> "$evidence_dir/functions/source-extraction-failures.txt"
                    if ! curl --fail --silent --show-error --location \
                      -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                      -H "Accept: multipart/form-data" \
                      "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/${slug}/body" \
                      --output "$evidence_dir/functions/raw/${slug}.multipart"; then
                      printf '%s\n' "$slug" \
                        >> "$evidence_dir/functions/body-capture-failures.txt"
                    fi
                  fi
                done
          )
          cp -R "$capture_work/supabase/functions" "$evidence_dir/functions/source"

          jq -n \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg project_ref "$SUPABASE_PROJECT_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg supabase_cli "$(supabase --version)" \
            --argjson function_body_complete \
              "$([ ! -s "$evidence_dir/functions/body-capture-failures.txt" ] && echo true || echo false)" \
            --argjson function_source_extracted \
              "$([ ! -s "$evidence_dir/functions/source-extraction-failures.txt" ] && echo true || echo false)" \
            '{
              captured_at: $captured_at,
              commit: $commit,
              function_body_complete: $function_body_complete,
              function_source_extracted: $function_source_extracted,
              project_ref: $project_ref,
              run_id: $run_id,
              supabase_cli: $supabase_cli,
              read_only: true
            }' > "$evidence_dir/manifest.json"

          (
            cd "$evidence_dir"
            find ledger schema functions -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum manifest.json >> SHA256SUMS
          )

      - name: Upload short-retention evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: supabase-production-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/supabase-production-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Verify evidence completeness
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/supabase-production-evidence"
          test -s "$evidence_dir/ledger/migrations.json"
          test -s "$evidence_dir/ledger/migration-list.txt"
          test -s "$evidence_dir/backups/inventory.json"
          test -s "$evidence_dir/schema/public.sql"
          test -s "$evidence_dir/schema/read-only-probes.json"
          test -s "$evidence_dir/schema/read-only-probes.sql"
          test -s "$evidence_dir/functions/inventory.json"
          test -s "$evidence_dir/SHA256SUMS"
          test -s "$evidence_dir/manifest.json"
          if [ -s "$evidence_dir/functions/body-capture-failures.txt" ]; then
            echo "Function body capture was incomplete for:"
            cat "$evidence_dir/functions/body-capture-failures.txt"
            exit 1
          fi
          if [ -s "$evidence_dir/functions/source-extraction-failures.txt" ]; then
            echo "Raw bodies retained after safe source extraction was refused for:"
            cat "$evidence_dir/functions/source-extraction-failures.txt"
          fi

      - name: Remove temporary evidence
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/supabase-production-evidence" \
            "$RUNNER_TEMP/supabase-function-capture"
