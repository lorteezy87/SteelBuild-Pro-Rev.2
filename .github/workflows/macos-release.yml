name: Mac App Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: Unused increasing Mac build number
        required: true
        type: string
      upload:
        description: Upload the validated package to App Store Connect
        default: false
        type: boolean
  push:
    branches: [claude/mac-ipad-build-20261016]
    paths: ['.github/workflows/macos-release.yml', 'scripts/macos-*.sh', 'scripts/macos-*.mjs']

permissions:
  contents: read
  actions: read

concurrency:
  group: mac-app-store-release
  cancel-in-progress: false

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require all five CI gates on this exact source commit
        uses: actions/github-script@v9
        env:
          MAC_UPLOAD: ${{ inputs.upload || false }}
        with:
          script: |
            const { assertMacReleaseChecks } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/macos-release-gate.mjs`);
            const upload = process.env.MAC_UPLOAD === 'true';
            if (upload && context.ref !== 'refs/heads/main') throw new Error('Uploads require main.');
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha, per_page: 100
              });
              const runs = data.workflow_runs.filter(run => run.head_branch === context.ref.replace('refs/heads/', '') &&
                (upload ? run.event === 'push' : ['push', 'pull_request'].includes(run.event)));
              const run = runs[0];
              if (run?.status === 'completed') {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo, run_id: run.id, filter: 'latest', per_page: 100
                });
                assertMacReleaseChecks(run, jobs, context.sha, context.ref.replace('refs/heads/', ''), upload);
                if (upload) {
                  const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
                  if (branch.commit.sha !== context.sha) throw new Error('Main changed; start a new release.');
                }
                return;
              }
              core.info('Waiting for exact-commit CI.');
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            throw new Error('Exact-commit CI did not complete in time.');

  package:
    needs: release-gates
    runs-on: macos-latest
    timeout-minutes: 45
    environment: app-store
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sign, package, validate, and optionally upload
        run: bash scripts/macos-release.sh
        env:
          MAC_VERSION: ${{ inputs.version || '1.0.0' }}
          MAC_BUILD_NUMBER: ${{ inputs.build_number || '20261016' }}
          MAC_UPLOAD: ${{ inputs.upload || false }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - name: Save sanitized release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release-${{ inputs.build_number || '20261016' }}-${{ github.run_id }}
          path: |
            macos/output/release-evidence.json
            macos/output/app-store-receipt.json
            macos/output/release-diagnostics.txt
            macos/output/SteelBuild-Pro-Mac.pkg
          if-no-files-found: warn
          retention-days: 30
