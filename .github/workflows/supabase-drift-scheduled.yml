name: Supabase drift (scheduled)

# The live-ledger drift check on a clock, not only on a push to main.
#
# Once SUPABASE_ACCESS_TOKEN lives only in the main-only `production`
# environment, branches and PRs can no longer read the production ledger (see
# the supabase-drift jobs in ci.yml). A migration stamped in production without
# its file landing would then surface only on the next merge to main — and
# block that merge's deploy. This surfaces it within hours instead, on main,
# where the fix belongs. Same checker, same fail-closed rules as ci.yml's
# `supabase-drift` job.
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-drift-scheduled
  cancel-in-progress: true

jobs:
  drift:
    name: Supabase drift check (scheduled)
    if: github.repository == 'lorteezy87/SteelBuild-Pro-Rev.2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check migration + edge-function drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty."
            echo "Configure it in the production environment to keep production drift checks enforced."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF is empty."
            echo "Configure the repository variable to keep production drift checks enforced."
            exit 1
          fi
          node scripts/supabase-drift-check.mjs
